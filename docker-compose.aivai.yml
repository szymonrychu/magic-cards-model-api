# Opus-vs-Opus: two continuous AI seats playing each other in one game,
# under `AI_SEAT_MODE=wrapper` with per-seat driver routing (DR7). This is a
# SEPARATE compose file from docker-compose.yml, not a profile of it - one
# game with two AI-driven seats needs two of every wrapper-mode container
# (agent + driver), each with its own writable guides checkout, and that
# doubling is not something the single-agent file should grow a flag for.
#
# Bring the whole thing up from the magic-cards-model-api directory:
#
#     cp .env.example .env   # then put ONE of these in it:
#                            #   CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`)
#                            #   ANTHROPIC_API_KEY        (a real sk-ant-... key)
#     mise run compose:aivai
#
# Then open a new AIvAI game at http://127.0.0.1:8000/ with both seats set to
# AI. `game`'s `DRIVER_URLS` lists both drivers; `ai_seat.driver_urls()`
# reads it and `ai_seat._dispatch_to_driver` sends each seat to the first
# driver whose own `/status` is idle, so the second seat's dispatch never
# hits the "one container, one match" 409 `driver-p1` would otherwise give
# it - see `ai_seat.py`'s module docstring and `_dispatch_to_driver`.
#
# Every build context is `..` because the engine is a path dependency at
# ../magic-cards-model, same as docker-compose.yml.
#
# `docker-compose.yml` itself is UNCHANGED - this file duplicates its
# single-seat services (game/agent/driver/guides-init/postgres) rather than
# extending them with `docker compose -f a -f b`, because every one of them
# needs a seat-specific override (env, ports, volumes) and a merge would be
# harder to read than the plain duplication below.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mtg}
      # No default on purpose - see docker-compose.yml's own postgres service.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:-mtg}
    ports:
      # See docker-compose.yml's own postgres service for what
      # POSTGRES_HOST_PORT/scripts/compose_env.py do here.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-mtg} -d ${POSTGRES_DB:-mtg}"]
      interval: 2s
      timeout: 3s
      retries: 30

  game:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "8000:8000"
    environment:
      - AI_SEAT_MODE=wrapper
      # DR7: an ordered candidate list, not the single DRIVER_URL - each AI
      # seat's dispatch is routed to whichever of these is idle
      # (`ai_seat.driver_urls`/`_dispatch_to_driver`). DRIVER_URL itself is
      # left unset here on purpose: DRIVER_URLS always wins when set, and
      # leaving both would suggest a fallback ordering that does not exist.
      - DRIVER_URLS=http://driver-p1:8090,http://driver-p2:8090
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
      # Opus-vs-Opus at low effort (bring-up fix, 2026-09-24): since
      # `agent_settings.AgentSettings.default` became the sole source of a
      # lobby game's seat model/effort (2026-09-19, `NewUiPlayer` can no
      # longer name one per request), `game` - not `agent-p1`/`agent-p2` -
      # is what actually decides it; those two containers' own MODEL/EFFORT
      # env only seed the wrapper's boot default, which the driver's
      # `sync_agent_settings` overwrites with whatever `game` computed
      # before turn 0. Without this, `game` fell through to
      # `AgentSettings.DEFAULT_MODEL`/`DEFAULT_EFFORT` (claude-sonnet-5/high,
      # the docker-compose.yml single-seat default) despite agent-p1/p2's
      # env claiming Opus-low - silently running the wrong seats.
      # `CLAUDE_AIVAI_MODEL`/`CLAUDE_AIVAI_EFFORT`, not
      # `CLAUDE_MODEL`/`CLAUDE_EFFORT` - both compose files read the same
      # `.env`, and `.env.example` ships `CLAUDE_MODEL=sonnet`/
      # `CLAUDE_EFFORT=high` as non-blank defaults for the single-seat file,
      # so this file's own fallback below never triggered for anyone who
      # followed the literal `cp .env.example .env` bring-up step - it
      # silently inherited sonnet/high. Dedicated vars close that collision.
      - AGENT_DEFAULT_MODEL=${CLAUDE_AIVAI_MODEL:-claude-sonnet-5}
      - AGENT_DEFAULT_EFFORT=${CLAUDE_AIVAI_EFFORT:-low}
      # Owner decision (T6): the buddy stays on Opus.
      - ADVISOR_MODEL=${ADVISOR_MODEL:-claude-opus-5}
      # FD6 (5), fb3-parity.md item 5: wired to the `postgres` service
      # below - already present here for `mise run test:pg` parity, but
      # never plumbed into `game` itself, so a finished local AIvAI game
      # was lost on restart (`InMemoryRepository`) and the review read a
      # different store than prod's own `REQUIRE_POSTGRES=1` one. Same
      # component vars as docker-compose.yml's own `migrate` service.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-mtg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:-mtg}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # fb3-parity.md item 13: no code in `magic_cards_model_api` reads
      # `/guides` outside `mcp-seat`'s own default root, and `game` never
      # runs `mcp-seat` - prod's own api pod carries no guides mount
      # either. Dropped rather than documented as unused.
      - scryfall-cache:/app/.scryfall-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://127.0.0.1:8000/api/health').raise_for_status()"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One writable clone per seat: two agents committing guide edits through
  # two independent git checkouts must never share one index/.git, or a
  # concurrent commit from one seat corrupts or blocks the other's -
  # `playscripts/gitwork.checkout_lock` only serialises writers within a
  # single checkout, not across two.
  guides-init-p1:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile.agent
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.282}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    command: ["/bin/sh", "/usr/local/bin/guides-clone.sh"]
    environment:
      - GH_PAT_FILE=/var/run/mtg-decks-git/GH_PAT
      - GUIDES_REF=main
      - GIT_TERMINAL_PROMPT=0
      - HOME=/agent-home
    secrets:
      - source: mtg_decks_gh_pat
        target: /var/run/mtg-decks-git/GH_PAT
    volumes:
      - agent-guides-p1:/guides

  guides-init-p2:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile.agent
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.282}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    command: ["/bin/sh", "/usr/local/bin/guides-clone.sh"]
    environment:
      - GH_PAT_FILE=/var/run/mtg-decks-git/GH_PAT
      - GUIDES_REF=main
      - GIT_TERMINAL_PROMPT=0
      - HOME=/agent-home
    secrets:
      - source: mtg_decks_gh_pat
        target: /var/run/mtg-decks-git/GH_PAT
    volumes:
      - agent-guides-p2:/guides

  agent-p1:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile.agent
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.282}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    depends_on:
      game:
        condition: service_healthy
      guides-init-p1:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Opus-vs-Opus at low effort by default: this file's whole point is a
      # cheap, fast self-play loop, and the post-game review stays the fixed
      # Opus-high `agent_settings.review_default()` regardless - see
      # `agent_settings.py`'s module docstring for the documented `low`
      # stop risk and where the loop watches for it (DR8).
      - MODEL=${CLAUDE_AIVAI_MODEL:-claude-sonnet-5}
      - EFFORT=${CLAUDE_AIVAI_EFFORT:-low}
      - MAX_THINKING_TOKENS=${CLAUDE_MAX_THINKING_TOKENS:-}
      - HTTP_ADDR=:8080
      - INTERNAL_ADDR=127.0.0.1:8090
      - WORKSPACE=/workspace
      - HOME_DIR=/agent-home
      - HOOK_COMMAND=/app/.venv/bin/cc-stop-hook
      - CCW_INTERNAL_URL=http://127.0.0.1:8090/internal/turn-complete
      - CCW_RESULT_JSON=/workspace/result.json
      - BASE_MCP_PATH=/app/deploy/mcp.base.json
      - TURN_TIMEOUT_SECONDS=1800
      - BOOT_TIMEOUT_SECONDS=120
      - LOG_LEVEL=info
      - AGENT_LOG_LEVEL=${AGENT_LOG_LEVEL:-tools}
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
      # Speed pass 2026-09-28, same pair and reasoning as docker-compose.yml's
      # single `agent` service and deploy/seat-job.yaml's agent container.
      - CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH=4096
      - MAX_MCP_OUTPUT_TOKENS=60000
      - MTG_ROLE=seat
      - SEAT_AGENT_CHANNEL=${SEAT_AGENT_CHANNEL:-teams}
      - SEAT_SUBAGENT_MODEL=${SEAT_SUBAGENT_MODEL:-claude-opus-5}
      - SEAT_SUBAGENT_EFFORT=${SEAT_SUBAGENT_EFFORT:-}
      - MTG_REQUIRE_BATON=${MTG_REQUIRE_BATON:-1}
      - MTG_GAME_ID=${MTG_GAME_ID:-}
      # FD6 (5), fb3-parity.md item 3: where the driver writes this game's
      # play-offer evidence record, read-only here - `plays admit` commits
      # it next to the deck's plays, same as `deploy/seat-job.yaml`'s agent
      # container.
      - MTG_EVIDENCE_DIR=/driver-workspace/evidence
    secrets:
      - source: mtg_decks_gh_pat
        target: /var/run/mtg-decks-git/GH_PAT
    volumes:
      # This seat's own writable checkout - never agent-p2's, so the two
      # git indexes (and the two agents' commits) never collide.
      - agent-guides-p1:/guides
      - ./memory:/workspace/memory
      - driver-workspace-p1:/driver-workspace:ro
    restart: unless-stopped
    stop_grace_period: 7410s

  agent-p2:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile.agent
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.282}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    depends_on:
      game:
        condition: service_healthy
      guides-init-p2:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - MODEL=${CLAUDE_AIVAI_MODEL:-claude-sonnet-5}
      - EFFORT=${CLAUDE_AIVAI_EFFORT:-low}
      - MAX_THINKING_TOKENS=${CLAUDE_MAX_THINKING_TOKENS:-}
      - HTTP_ADDR=:8080
      - INTERNAL_ADDR=127.0.0.1:8090
      - WORKSPACE=/workspace
      - HOME_DIR=/agent-home
      - HOOK_COMMAND=/app/.venv/bin/cc-stop-hook
      - CCW_INTERNAL_URL=http://127.0.0.1:8090/internal/turn-complete
      - CCW_RESULT_JSON=/workspace/result.json
      - BASE_MCP_PATH=/app/deploy/mcp.base.json
      - TURN_TIMEOUT_SECONDS=1800
      - BOOT_TIMEOUT_SECONDS=120
      - LOG_LEVEL=info
      - AGENT_LOG_LEVEL=${AGENT_LOG_LEVEL:-tools}
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
      - CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH=4096
      - MAX_MCP_OUTPUT_TOKENS=60000
      - MTG_ROLE=seat
      - SEAT_AGENT_CHANNEL=${SEAT_AGENT_CHANNEL:-teams}
      - SEAT_SUBAGENT_MODEL=${SEAT_SUBAGENT_MODEL:-claude-opus-5}
      - SEAT_SUBAGENT_EFFORT=${SEAT_SUBAGENT_EFFORT:-}
      - MTG_REQUIRE_BATON=${MTG_REQUIRE_BATON:-1}
      - MTG_GAME_ID=${MTG_GAME_ID:-}
      - MTG_EVIDENCE_DIR=/driver-workspace/evidence
    secrets:
      - source: mtg_decks_gh_pat
        target: /var/run/mtg-decks-git/GH_PAT
    volumes:
      - agent-guides-p2:/guides
      - ./memory:/workspace/memory
      - driver-workspace-p2:/driver-workspace:ro
    restart: unless-stopped
    stop_grace_period: 7410s

  driver-p1:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
    command: ["python", "-m", "mtg_agent.driver"]
    depends_on:
      - agent-p1
    ports:
      - "8090:8090"
    environment:
      - GAME_API=http://game:8000
      # Points at this driver's own agent, never the other seat's.
      - WRAPPER_API=http://agent-p1:8080
      - DRIVER_SELF_URL=http://driver-p1:8090
      - SEAT_AGENT_CHANNEL=${SEAT_AGENT_CHANNEL:-teams}
      - SEAT_SUBAGENT_MODEL=${SEAT_SUBAGENT_MODEL:-claude-opus-5}
      - SEAT_SUBAGENT_EFFORT=${SEAT_SUBAGENT_EFFORT:-}
      - GUIDES_ROOT=/guides
      - MEMORY_ROOT=/workspace/memory
      - DRIVER_WORKSPACE=/driver-workspace
      - HTTP_ADDR=:8090
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
    volumes:
      # Read-only mount of agent-p1's own guides checkout, so this driver
      # reads *its* agent's results journal / revision stamp - never
      # agent-p2's.
      - agent-guides-p1:/guides:ro
      - ./memory:/workspace/memory
      # Read-write here, read-only on agent-p1: the driver writes this
      # game's evidence record, the agent's `mcp-seat plays admit` reads it
      # (`MTG_EVIDENCE_DIR` above) - same shape as `deploy/seat-job.yaml`.
      - driver-workspace-p1:/driver-workspace
    stop_grace_period: 7410s

  driver-p2:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
    command: ["python", "-m", "mtg_agent.driver"]
    depends_on:
      - agent-p2
    ports:
      - "8091:8090"
    environment:
      - GAME_API=http://game:8000
      - WRAPPER_API=http://agent-p2:8080
      - DRIVER_SELF_URL=http://driver-p2:8090
      - SEAT_AGENT_CHANNEL=${SEAT_AGENT_CHANNEL:-teams}
      - SEAT_SUBAGENT_MODEL=${SEAT_SUBAGENT_MODEL:-claude-opus-5}
      - SEAT_SUBAGENT_EFFORT=${SEAT_SUBAGENT_EFFORT:-}
      - GUIDES_ROOT=/guides
      - MEMORY_ROOT=/workspace/memory
      - DRIVER_WORKSPACE=/driver-workspace
      - HTTP_ADDR=:8090
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
    volumes:
      - agent-guides-p2:/guides:ro
      - ./memory:/workspace/memory
      - driver-workspace-p2:/driver-workspace
    stop_grace_period: 7410s

secrets:
  # Sourced from the MTG_DECKS_GH_PAT environment variable, same as
  # docker-compose.yml. Mounted only into the two guides-init clones and the
  # two agents - never into a driver or into game.
  mtg_decks_gh_pat:
    environment: MTG_DECKS_GH_PAT

volumes:
  scryfall-cache:
  postgres-data:
  agent-guides-p1:
  agent-guides-p2:
  driver-workspace-p1:
  driver-workspace-p2:
