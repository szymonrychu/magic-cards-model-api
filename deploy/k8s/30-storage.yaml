# Two PersistentVolumeClaims. The deck guides are NOT here: they are an
# emptyDir filled by an initContainer that clones the guide repo on every Pod
# start (see 50-pod.yaml), so there is nothing to provision for them.
#
# Neither claim names a storageClassName, so both take the cluster's DEFAULT
# StorageClass. In this cluster that is `rook-ceph-rwx` (CephFS), verified with
# `kubectl get sc` - both claims bind to it as written, no edit needed.
#
# On a cluster with no default StorageClass both PVCs stay `Pending` forever
# and the Pod never starts - `kubectl -n mtg-engine get pvc` shows it, and
# `kubectl -n mtg-engine describe pvc mtg-agent-memory` says "no persistent
# volumes available for this claim and no storage class is set". Fix it either
# by marking a StorageClass default:
#
#     kubectl annotate storageclass <name> \
#       storageclass.kubernetes.io/is-default-class=true
#
# or by uncommenting and filling in `storageClassName` on both claims below.
---
# The agent's own notes. This is the one thing that crosses a match boundary:
# the agent container exits after every match and comes back empty, so
# /workspace/memory is where cross-game learning actually lives. Losing this
# volume means losing everything the agent has learned.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mtg-agent-memory
  namespace: mtg-engine
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: rook-ceph-rwx
  resources:
    requests:
      storage: 1Gi
---
# The Scryfall card cache. Not correctness-critical, purely speed: a cold
# cache re-fetches every card on first use (measured at 34.5s for a single
# decklist), and every Pod restart would pay it again without a volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mtg-scryfall-cache
  namespace: mtg-engine
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: rook-ceph-rwx
  resources:
    requests:
      storage: 2Gi
