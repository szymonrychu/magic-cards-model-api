# One AI agent's Kubernetes Job, as a complete manifest with a closed set of
# placeholders - a playing seat, or (B5) a **buddy**: an advisor container
# watching one human seat's own view and proposing rather than acting. Both
# render from this one file, deliberately: same images, same driver sidecar,
# same mcp-config, and the only differences are set in code by
# `k8s_seats.build_job` - the `mtg-buddy-*` name, an extra `mtg/role=advisor`
# label, `role` inside `__ASSIGNMENT_JSON__`'s payload (written only for an
# advisor, so a seat's rendered assignment is byte-identical to what it always
# was), and the agent container's `MTG_ROLE` through `__MTG_ROLE__`.
# `k8s_seats.build_job` reads this file (path from
# `SEAT_JOB_TEMPLATE_PATH`, default this path), substitutes the
# `__X__` tokens below with this seat's per-render values, then sets
# `metadata.name`, `metadata.namespace`, the identity labels
# (`app.kubernetes.io/name`, `mtg/game-id`, `mtg/seat-uid`, plus `mtg/role`
# on an advisor) and the annotations in code. Every placeholder appears as the WHOLE value of a
# mapping entry (never embedded inside a larger string), so substitution is
# a plain per-node dict/list walk with no YAML-escaping to get wrong.
#
# The placeholders (`SEAT_JOB_PLACEHOLDERS`, the closed set both directions
# of `tests/test_k8s_seats.py` pin this file against - M10 of
# docs/2b-plan.md's phase-2b plan, plus the two images and the guides ref
# added since):
#   __GAME_ID__              - the game this seat belongs to
#   __SEAT_UID__              - this seat's uid
#   __PLAYER__                - which player in the game this seat plays
#   __API_URL__                - the api's own base URL (GAME_API / api_base)
#   __MCP_URL__                - the mcp service's URL (M2: stateless HTTP)
#   __ASSIGNMENT_JSON__        - the driver's self-dispatch payload
#   __MODEL__ / __EFFORT__ / __MAX_THINKING_TOKENS__ - this seat's AgentSettings
#   __AGENT_IMAGE__ / __API_IMAGE__ - the pushed images this deploy pinned
#   __GUIDES_REF__             - which deck-guides revision to check out (must be main)
#   __MTG_ROLE__ / __MTG_GAME_ID__ - the agent container's own role and game
#
# Everything else in this file is deliberately NOT a placeholder - it is
# deploy-time configuration (secrets, the memory PVC name, the guides repo
# URL, the job deadline/ttl, the spellslinger URL) that used to be
# read from `K8sSettings`/env and is now baked into this committed file, the
# same way `deploy/k8s/*.yaml` already bakes its own. One known gap this
# leaves, accepted for this task (see T9's report):
#   - image tags: still the literal `__TAG__` idiom `mise run k8s:deploy`
#     substitutes for the other `deploy/k8s/*.yaml` manifests, but nothing
#     in that pipeline touches this file yet - T20 is where the raw-manifest
#     tag-pinning problem is actually fixed.
#
# The `mcp-config` initContainer picks the seat's `mtg` MCP server by whether
# `MCP_URL` is set. Empty (today's reality - the mcp service does not exist
# as its own deployment until the stage-B/C cut, so `K8sSettings.mcp_url`
# defaults to "") renders a stdio entry that runs the agent image's own
# `magic_cards_model_api.mcp` module in-container, pinned to this seat's
# `--api`/`--game` - the same working shape `docker compose` already uses
# (`deploy/mcp.base.json`), so an agent always has a real `mtg` MCP server
# rather than none at all. Non-empty (once a later stage's chart sets
# `MCP_SERVICE_URL`) renders the http entry against that URL instead - the
# eventual M2 http service takes over by setting one env var, no template
# change needed.
#
# Both branches carry `"alwaysLoad": true` on the `mtg` entry, and both have
# to: Claude Code defers every MCP server's tools behind its `ToolSearch`
# tool unless the server's own config entry opts out, and `alwaysLoad` is
# that opt-out ("Exempt a server from deferral",
# https://code.claude.com/docs/en/mcp - "set `alwaysLoad` to `true` in that
# server's configuration ... available on all server types"). The `mtg`
# tools are the whole of a seat's job, so a seat that has to search for them
# spends its opening inferences hunting instead of playing - one production
# pod burned 13 `ToolSearch` calls and about 51 seconds before giving up.
# It is `alwaysLoad`, NOT `anthropic/alwaysLoad`: the latter is a *server*'s
# own per-tool `_meta` marker in its `tools/list` answer and does nothing at
# all in a config file, which is the silent-failure spelling
# `tests/test_k8s_seats.py` pins both branches against. `spellslinger` is
# deliberately left deferred - it is a large, occasional reference surface
# (card text and rules lookups), not the seat's per-turn toolset.
#
# `ownerReferences` is gone on purpose (T9/T10): with durable games, an api
# restart must not garbage-collect the seat Jobs of games that survived it.
# `activeDeadlineSeconds`/`ttlSecondsAfterFinished` remain the backstop that
# used to be `ownerReferences`' job too.
apiVersion: batch/v1
kind: Job
metadata:
  name: mtg-seat-g1234567-u1234567
  namespace: mtg-engine
  labels:
    app.kubernetes.io/name: mtg-agent
    mtg/game-id: g1234567890
    mtg/seat-uid: u1234567890
  annotations:
    mtg/player: bot
    mtg/model: opus
    mtg/effort: max
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mtg-agent
        mtg/game-id: g1234567890
        mtg/seat-uid: u1234567890
    spec:
      restartPolicy: Never
      # Room for a clean handover when the Job is deleted mid-game, subagent
      # development included: the driver's handover gives up at 1680s, its
      # preStop waits 1740s for that, the agent's preStop waits up to 1760s
      # for the marker (and for its own last push), and both finish inside
      # this grace before the kubelet sends SIGKILL. activeDeadlineSeconds
      # (14400) is far longer, so it never cuts the grace short.
      terminationGracePeriodSeconds: 1800
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: guides
        emptyDir: {}
      - name: memory
        persistentVolumeClaim:
          claimName: mtg-agent-memory
      - name: driver-workspace
        emptyDir: {}
      - name: mcp
        emptyDir: {}
      # The GitHub PAT (Secret `mtg-decks-git`, key `GH_PAT`) as a FILE, never
      # an env var: an env var is one `env` away from the agent's own log.
      # 0440 is owner+group read; `fsGroup: 1000` above makes uid 1000 that
      # group. Mounted into the `guides` initContainer (to fetch) and the
      # `agent` container (git's credential helper reads it to push) - the
      # driver gets no mount. A projected Secret file is updated in place
      # when the Secret is rotated, so a running pod picks up a new token.
      - name: mtg-decks-git
        secret:
          secretName: mtg-decks-git
          defaultMode: 0440
          items:
          - key: GH_PAT
            path: GH_PAT
      initContainers:
      # A writable, partial clone of the deck-guides repo: `main` fetched with
      # `--filter=blob:none` (full history, blobs on demand), checked out as a
      # local `main` tracking `origin/main`, the token stripped back out of
      # the remote URL, the revision stamped into `.guides-revision`. The
      # script is `deploy/guides-clone.sh`, baked into the agent image by
      # Dockerfile.agent; `tests/test_k8s_seats.py` runs that same file
      # against a real local bare repo.
      - name: guides
        image: __AGENT_IMAGE__
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - /usr/local/bin/guides-clone.sh
        env:
        - name: GH_PAT_FILE
          value: /var/run/mtg-decks-git/GH_PAT
        # Which revision of the corpus this seat plays against. The checkout
        # is writable, so the script accepts only `main` and refuses anything
        # else with a message saying so. What it checked out is written to
        # `/guides/.guides-revision`, where the driver reads it back
        # (`mtg_agent/driver/revision.py`) and stamps it into the briefing
        # and the game's plan file.
        - name: GUIDES_REF
          value: __GUIDES_REF__
        - name: GIT_TERMINAL_PROMPT
          value: '0'
        - name: HOME
          value: /agent-home
        volumeMounts:
        - name: guides
          mountPath: /guides
        - name: mtg-decks-git
          mountPath: /var/run/mtg-decks-git
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      - name: mcp-config
        image: __AGENT_IMAGE__
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -euc
        - 'out="${MCP_JSON_OUT:-/etc/mtg/mcp.json}"

          if [ -n "$MCP_URL" ]; then mtg="{\"type\": \"http\", \"url\": \"$MCP_URL\", \"alwaysLoad\": true}"; else mtg="{\"command\": \"/app/.venv/bin/python\", \"args\": [\"-m\", \"magic_cards_model_api.mcp\", \"--api\", \"$API_URL\", \"--game\", \"$GAME_ID\", \"--transport\", \"stdio\"], \"alwaysLoad\": true}"; fi

          printf "%s" "{\"mcpServers\": {\"mtg\": $mtg, \"spellslinger\": {\"type\": \"http\", \"url\": \"http://spellslinger-mcp-http.spellslinger-development.svc.cluster.local:8080/mcp\"}}}" > "$out"

          '
        env:
        - name: MCP_URL
          value: __MCP_URL__
        - name: API_URL
          value: __API_URL__
        - name: GAME_ID
          value: __GAME_ID__
        volumeMounts:
        - name: mcp
          mountPath: /etc/mtg
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: agent
        image: __AGENT_IMAGE__
        imagePullPolicy: IfNotPresent
        ports:
        - name: agent
          containerPort: 8080
        env:
        - name: HTTP_ADDR
          value: :8080
        - name: INTERNAL_ADDR
          value: 127.0.0.1:8099
        - name: WORKSPACE
          value: /workspace
        - name: HOME_DIR
          value: /agent-home
        - name: HOOK_COMMAND
          value: /app/.venv/bin/cc-stop-hook
        - name: CCW_INTERNAL_URL
          value: http://127.0.0.1:8099/internal/turn-complete
        - name: CCW_RESULT_JSON
          value: /workspace/result.json
        - name: BASE_MCP_PATH
          value: /etc/mtg/mcp.json
        - name: TURN_TIMEOUT_SECONDS
          value: '1800'
        - name: BOOT_TIMEOUT_SECONDS
          value: '120'
        - name: LOG_LEVEL
          value: info
        - name: AGENT_LOG_LEVEL
          value: tools
        - name: ACCESS_LOG_QUIET
          value: '1'
        - name: MODEL
          value: __MODEL__
        - name: EFFORT
          value: __EFFORT__
        - name: MAX_THINKING_TOKENS
          value: __MAX_THINKING_TOKENS__
        # Who this agent is, for the branches and commits it makes in the
        # writable guides checkout: `seat` or `advisor`, and its game.
        - name: MTG_ROLE
          value: __MTG_ROLE__
        - name: MTG_GAME_ID
          value: __MTG_GAME_ID__
        - name: GIT_COMMITTER_NAME
          value: mtg-agent
        - name: GIT_COMMITTER_EMAIL
          value: mtg-agent@mtg-trainer.invalid
        envFrom:
        - secretRef:
            name: mtg-agent
        # `/guides` is writable here, and only here: the agent commits guide
        # changes in it. The driver keeps it read-only. `~/.gitconfig`
        # (written by the wrapper's bootstrap) points git's credential helper
        # at the token file below and marks `/guides` a safe.directory.
        volumeMounts:
        - name: guides
          mountPath: /guides
        - name: memory
          mountPath: /workspace/memory
        - name: mcp
          mountPath: /etc/mtg
          readOnly: true
        - name: driver-workspace
          mountPath: /driver-workspace
          readOnly: true
        - name: mtg-decks-git
          mountPath: /var/run/mtg-decks-git
          readOnly: true
        # Waits (up to 1760s, inside the 1800s grace) for the driver's handover
        # to finish before the wrapper is stopped.
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -m
              - mtg_agent.wrapper.handover_wait
              - --wait
              - '1760'
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 3Gi
      - name: driver
        image: __API_IMAGE__
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - mtg_agent.driver
        ports:
        - name: driver
          containerPort: 8090
        env:
        - name: GAME_API
          value: __API_URL__
        - name: WRAPPER_API
          value: http://127.0.0.1:8080
        - name: DRIVER_SELF_URL
          value: http://127.0.0.1:8090
        - name: GUIDES_ROOT
          value: /guides
        - name: MEMORY_ROOT
          value: /workspace/memory
        - name: DRIVER_WORKSPACE
          value: /driver-workspace
        - name: HTTP_ADDR
          value: :8090
        - name: ACCESS_LOG_QUIET
          value: '1'
        - name: DRIVER_EXIT_AFTER_MATCH
          value: '1'
        - name: GAME_ID
          value: __GAME_ID__
        - name: SEAT_UID
          value: __SEAT_UID__
        - name: PLAYER
          value: __PLAYER__
        - name: DRIVER_ASSIGNMENT_JSON
          value: __ASSIGNMENT_JSON__
        volumeMounts:
        - name: guides
          mountPath: /guides
          readOnly: true
        - name: memory
          mountPath: /workspace/memory
        - name: driver-workspace
          mountPath: /driver-workspace
        # Hands the seat over (up to 1740s, inside the 1800s grace) before the
        # driver is stopped.
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -m
              - mtg_agent.driver.handover
              - --wait
              - '1740'
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8090
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
