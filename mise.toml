[tools]
python = "3.13"
uv = "latest"
# Pinned, not "latest": an unpinned node let CI (whatever the GitHub runner
# happened to ship, v22.23.2 at the time) diverge from every developer's
# local node and go red on a change that was green locally. 24.21.0 is the
# current Active LTS release - new enough that the UI test suite (~43
# `tests/test_ui_*.py` files driving `ui/*.js` for real under
# `tests/ui_node.py::run_module`) passes on it, and an LTS line rather than
# the Current release track this machine happens to have installed.
node = "24.21.0"
# k8s:deploy shells out to kubectl; pinned so it never falls back to a stale
# system symlink (the Homebrew Docker cask one went dangling 2026-10-14).
kubectl = "1.37.0"

[env]
_.python.venv = { path = ".venv", create = true }
_.file = { path = ".env", missing = "ignore" }
UV_PYTHON_DOWNLOADS = "never"
# Images live in harbor under the `containers` project. One image serves both
# the game and the driver - the driver only overrides the command.
HARBOR = "harbor.szymonrichert.pl/containers"

[tasks.install]
description = "Install into the venv (engine comes from ../magic-cards-model)"
run = "uv sync"

[tasks.run]
description = "Serve the API and the frontend on http://127.0.0.1:8000"
alias = "default"
run = "uv run uvicorn magic_cards_model_api.main:app --host 127.0.0.1 --port 8000"

[tasks.test]
description = "Run the API tests - always docker-free against InMemoryRepository, even if MCM_TEST_DATABASE_URL is set in .env or the shell (use `mise run test:pg` for postgres)"
run = """
set -eu
unset MCM_TEST_DATABASE_URL MCM_REQUIRE_POSTGRES_TESTS
uv run pytest -n "${PYTEST_WORKERS:-6}" --ignore=tests/test_ui_viewport_layout.py
# tests/test_ui_viewport_layout.py drives real headless Chrome, and its own
# `measurements` fixture docstring already names the failure mode `-n 6`
# reopens even with every OTHER copy of this file kept off other workers
# (its `xdist_group` marker): the other five `-n 6` workers above are still
# saturating the remaining cores for the whole run above, and this file's
# documented "roughly one run in five" per-attempt flake rate (measured in
# total CPU isolation) climbs past its 6-attempt retry budget under that
# contention. Run alone, serially, after the parallel run finishes and every
# other worker has exited - the closest this suite can get to the serial CPU
# availability the retry count was actually tuned against.
uv run pytest tests/test_ui_viewport_layout.py
"""

[tasks."tools:export"]
description = "Write contract/tools.json from mcp.py's @server.tool() registrations (T3): the artifact tests/test_prompt_matches_tools.py checks driver/prompt.py's prose against. Deterministic - run twice, git status stays clean."
run = "uv run python scripts/export_tools.py"
[tasks."playscript:export"]
description = "Write contract/playscript.schema.json from playscripts/schema.py's Play model: the JSON Schema a decks/<slug>/plays/<id>.json script must satisfy, checked by tests/test_playscript_export_drift.py. Deterministic - run twice, git status stays clean."
run = "uv run python scripts/export_playscript_schema.py"
[tasks."openapi:dump"]
description = "Regenerate the committed openapi.json from the live FastAPI app - the fix for a red test_openapi_drift.py"
run = "uv run python scripts/dump_openapi.py"
[tasks."fixtures:payloads"]
description = "Write fixtures/payloads/<case>.json (T2) by playing seven real boards through the live API - the artifact tests/test_ui_fixture_shape.py checks against. Deterministic - run twice, git status stays clean."
run = "uv run python scripts/generate_payload_fixtures.py"

[tasks."icons:generate"]
description = "Write ui/icons/icon-192.png and icon-512.png, the home-screen app icons ui/manifest.webmanifest names. Stdlib only. Deterministic - run twice, git status stays clean."
run = "uv run python scripts/generate_app_icons.py"

[tasks.lint]
description = "Ruff check"
run = "uv run ruff check ."

[tasks.fmt]
description = "Ruff format and fix"
run = "uv run ruff format . && uv run ruff check --fix ."

[tasks."db:migrate"]
description = "Apply postgres schema migrations. One-shot - never from app startup, never from an init container (see docker-compose.yml's `migrate` service)."
run = "uv run alembic upgrade head"

[tasks."test:pg"]
description = "Run the full suite against real postgres (T9): brings up docker compose's `postgres` locally, or uses MCM_TEST_DATABASE_URL as-is when it is already set (CI's service container). Always exercises the postgres-backed tests - fails loudly rather than skip if it cannot reach a database."
run = """
set -eu
# scripts/compose_env.py: a worktree checkout (same basename as the main
# checkout everywhere) otherwise derives docker compose's SAME default
# project name as the main checkout - see that module's docstring for the
# shared-volume password corruption this caused for real. COMPOSE_PROJECT_NAME
# keeps every docker compose invocation below isolated per checkout;
# POSTGRES_HOST_PORT is 5432 for the main checkout (unchanged) and an
# ephemeral (0) host port for a worktree, whose actual bound port is read
# back below rather than assumed.
eval "$(uv run python scripts/compose_env.py)"
export COMPOSE_PROJECT_NAME POSTGRES_HOST_PORT
if [ -z "${MCM_TEST_DATABASE_URL:-}" ]; then
  # `docker compose` interpolates every service's variables even when only
  # `postgres` is targeted - `game`/`agent`/`driver` require MTG_DECKS
  # (see .env.example), which this postgres-only run has no reason to need
  # for real, so a harmless placeholder stands in when it is not set.
  export MTG_DECKS="${MTG_DECKS:-/tmp}"
  POSTGRES_PASSWORD="$(./scripts/postgres-password.sh)"
  export POSTGRES_PASSWORD
  docker compose up -d postgres
  # A worktree's postgres (COMPOSE_PROJECT_NAME suffixed off the main
  # checkout's) is throwaway - a fresh ephemeral-port container/volume per
  # run, never the main checkout's own long-lived one - so it is torn down
  # here on every exit path (pass, fail, or Ctrl-C) rather than left running.
  # The main checkout's own postgres is untouched: no trap, same as before.
  if [ "$COMPOSE_PROJECT_NAME" != "magic-cards-model-api" ]; then
    cleanup_worktree_postgres() { docker compose down -v postgres >/dev/null 2>&1 || true; }
    trap cleanup_worktree_postgres EXIT
  fi
  ready=0
  for _ in $(seq 1 60); do
    # -h 127.0.0.1 on purpose: alembic below connects over TCP, so that is what
    # has to be ready. The default unix-socket probe is answered by the image's
    # initdb bootstrap server too, which reports ready and then goes away.
    if docker compose exec -T postgres pg_isready -h 127.0.0.1 -U "${POSTGRES_USER:-mtg}" -d "${POSTGRES_DB:-mtg}" >/dev/null 2>&1; then
      ready=1
      break
    fi
    sleep 1
  done
  if [ "$ready" -ne 1 ]; then
    echo "test:pg: postgres never became ready (pg_isready kept failing for 60s) - refusing to silently skip the postgres suite" >&2
    exit 1
  fi
  # Never assume :5432 - POSTGRES_HOST_PORT may be 0 (ephemeral) for a
  # worktree, so the ACTUAL bound host port is read back from compose itself.
  actual_port="$(docker compose port postgres 5432 | sed 's/.*://')"
  export MCM_TEST_DATABASE_URL="postgresql+psycopg://${POSTGRES_USER:-mtg}:${POSTGRES_PASSWORD}@localhost:${actual_port}/${POSTGRES_DB:-mtg}"
fi
DATABASE_URL="$MCM_TEST_DATABASE_URL" uv run alembic upgrade head
# MCM_REQUIRE_POSTGRES_TESTS=1 turns a missing/unreachable database into a
# hard pytest failure instead of a quiet skip (see conftest.py's
# require_postgres_database_url) - test:pg must never report success while
# the postgres-parameterised tests did not actually run.
MCM_TEST_DATABASE_URL="$MCM_TEST_DATABASE_URL" MCM_REQUIRE_POSTGRES_TESTS=1 uv run pytest -n "${PYTEST_WORKERS:-6}" --ignore=tests/test_ui_viewport_layout.py
# See `test`'s own comment on the matching line: this file's real-Chrome
# flake rate climbs past its retry budget while five other workers are still
# busy, `xdist_group` or not - carved out to run alone, serially, after them.
MCM_TEST_DATABASE_URL="$MCM_TEST_DATABASE_URL" MCM_REQUIRE_POSTGRES_TESTS=1 uv run pytest tests/test_ui_viewport_layout.py
"""

[tasks."eval:gauntlet"]
description = "Play N seeded games of the agent seat against the zero-LLM baseline and print the scorecard - the measuring stick every 'this made it play better' claim needs. Brings postgres up itself, because the report reads the games/records tables."
# Postgres is not optional here and the task refuses to pretend otherwise.
# `serve.py` boots the games into whatever store its own environment selects
# (`store.select_store`), and with nothing configured that is
# `InMemoryRepository` - a ledger inside a process that is about to be shut
# down, which `scripts/eval_report.py` could never read. Bringing the database
# up here, the same way `test:pg` does, is what makes the run reportable at
# all; failing loudly when it does not come up is what keeps a green gauntlet
# from meaning "10 games played and nothing recorded".
run = """
set -eu
# See test:pg's own comment on the matching line: keeps this task's docker
# compose invocations isolated per checkout instead of colliding on the same
# project name every worktree's basename otherwise produces.
eval "$(uv run python scripts/compose_env.py)"
export COMPOSE_PROJECT_NAME POSTGRES_HOST_PORT
if [ -z "${DATABASE_URL:-}" ]; then
  # `docker compose` interpolates every service's variables even when only
  # `postgres` is targeted - `game`/`agent`/`driver` require MTG_DECKS - so a
  # placeholder stands in for a postgres-only bring-up, as in `test:pg`.
  export MTG_DECKS="${MTG_DECKS:-/tmp}"
  POSTGRES_PASSWORD="$(./scripts/postgres-password.sh)"
  export POSTGRES_PASSWORD
  docker compose up -d postgres
  ready=0
  for _ in $(seq 1 60); do
    # -h 127.0.0.1 on purpose: everything below connects over TCP, and the
    # image's initdb bootstrap server answers the unix-socket probe and then
    # goes away.
    if docker compose exec -T postgres pg_isready -h 127.0.0.1 -U "${POSTGRES_USER:-mtg}" -d "${POSTGRES_DB:-mtg}" >/dev/null 2>&1; then
      ready=1
      break
    fi
    sleep 1
  done
  if [ "$ready" -ne 1 ]; then
    echo "eval:gauntlet: postgres never became ready (pg_isready kept failing for 60s) - refusing to run a gauntlet whose ledger nothing could read" >&2
    exit 1
  fi
  # Never assume :5432 - see test:pg's own comment on the matching line.
  actual_port="$(docker compose port postgres 5432 | sed 's/.*://')"
  export DATABASE_URL="postgresql+psycopg://${POSTGRES_USER:-mtg}:${POSTGRES_PASSWORD}@localhost:${actual_port}/${POSTGRES_DB:-mtg}"
fi
uv run alembic upgrade head
uv run python scripts/eval_gauntlet.py "$@"
"""

[tasks."probe:seat-pair"]
description = "Spike probe (real API spend): build the agent image (claude 2.1.282), start game+agent under a private compose project, run one probe turn through the wrapper and check a Sonnet lead can drive two Opus helpers over --channel teams|subagents. Report JSON to scratch; transcripts to tests/wrapper/fixtures/seat_pair/<channel>/."
run = 'uv run python scripts/probe_seat_pair.py "$@"'

[tasks.compose]
description = "Bring up postgres + game + continuous agent + driver"
run = """
set -eu
# See test:pg's own comment on the matching line: isolates this stack's
# project name (and postgres host port) per checkout.
eval "$(uv run python scripts/compose_env.py)"
export COMPOSE_PROJECT_NAME POSTGRES_HOST_PORT
POSTGRES_PASSWORD="$(./scripts/postgres-password.sh)"
export POSTGRES_PASSWORD
docker compose up --build
"""

[tasks."compose:down"]
description = "Stop the compose stack. Pass -v to drop the postgres and cache volumes."
run = """
set -eu
eval "$(uv run python scripts/compose_env.py)"
export COMPOSE_PROJECT_NAME POSTGRES_HOST_PORT
POSTGRES_PASSWORD="$(./scripts/postgres-password.sh)"
export POSTGRES_PASSWORD
export MTG_DECKS="${MTG_DECKS:-/tmp}"
docker compose down "$@"
"""

[tasks."compose:aivai"]
description = "Bring up the Opus-vs-Opus stack (DR7): postgres + game + two agent/driver pairs, one per seat, routed by DRIVER_URLS."
run = """
set -eu
eval "$(uv run python scripts/compose_env.py)"
export COMPOSE_PROJECT_NAME POSTGRES_HOST_PORT
POSTGRES_PASSWORD="$(./scripts/postgres-password.sh)"
export POSTGRES_PASSWORD
docker compose -f docker-compose.aivai.yml up --build
"""

[tasks."compose:aivai:down"]
description = "Stop the Opus-vs-Opus stack. Pass -v to drop the postgres, cache and guides volumes."
run = """
set -eu
eval "$(uv run python scripts/compose_env.py)"
export COMPOSE_PROJECT_NAME POSTGRES_HOST_PORT
POSTGRES_PASSWORD="$(./scripts/postgres-password.sh)"
export POSTGRES_PASSWORD
export MTG_DECKS="${MTG_DECKS:-/tmp}"
docker compose -f docker-compose.aivai.yml down "$@"
"""

[tasks."aivai:down"]
description = "Tear down the Opus-vs-Opus stack fast (60s grace) and drop its volumes, including leftover live games."
run = """
set -eu
eval "$(uv run python scripts/compose_env.py)"
export COMPOSE_PROJECT_NAME POSTGRES_HOST_PORT
POSTGRES_PASSWORD="$(./scripts/postgres-password.sh)"
export POSTGRES_PASSWORD
export MTG_DECKS="${MTG_DECKS:-/tmp}"
docker compose -f docker-compose.aivai.yml down -v -t 60
"""

[tasks."aivai:budget"]
description = "Where an AIvAI match's time went: per-seat waits, model steps by role, promotions, baton refusals, match seconds vs 900. Pass --json for JSON."
run = """
set -eu
eval "$(uv run python scripts/compose_env.py)"
export COMPOSE_PROJECT_NAME POSTGRES_HOST_PORT
POSTGRES_PASSWORD="$(./scripts/postgres-password.sh)"
export POSTGRES_PASSWORD
export MTG_DECKS="${MTG_DECKS:-/tmp}"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
docker compose -f docker-compose.aivai.yml logs --no-color --no-log-prefix game > "$tmp/game.log"
docker compose -f docker-compose.aivai.yml logs --no-color --no-log-prefix agent-p1 > "$tmp/p1.log"
docker compose -f docker-compose.aivai.yml logs --no-color --no-log-prefix agent-p2 > "$tmp/p2.log"
uv run python scripts/match_time_budget.py \
  --seat p1=http://127.0.0.1:8080/metrics --seat p2=http://127.0.0.1:8081/metrics \
  --agent-log "p1=$tmp/p1.log" --agent-log "p2=$tmp/p2.log" \
  --game-log "$tmp/game.log" "$@"
"""

[tasks.image-tag]
description = "Print the tag the image tasks would use: <api sha>-<engine sha>"
# BOTH shas, because BOTH repos are baked into the image. With the api sha
# alone, an engine-only change produced an identical tag: `kubectl apply` saw
# no diff, said "unchanged", and `imagePullPolicy: IfNotPresent` meant even a
# restart reused the stale cached image. The pod then ran old engine code while
# every check said it was up to date. The engine sha is also kept as a label,
# but a label cannot make Kubernetes notice a change - only the tag can.
run = "echo \"$(git rev-parse --short HEAD)-$(git -C ../magic-cards-model rev-parse --short HEAD)\""

[tasks."docker:build:api"]
description = "Build the api image (game + driver) locally, tagged with the sha"
# Context is `..` because the engine at ../magic-cards-model is a path
# dependency. `--file` is resolved relative to the CWD, not to the context, so
# it stays a bare `Dockerfile` even though the context is the parent. The tag
# carries BOTH shas, `<api>-<engine>`, because both repos are baked in - see
# `image-tag` for the stale-pod bug that an api-only tag caused. The engine sha
# is also kept as a label, for tooling that reads labels rather than tags.
run = """
set -eu
TAG="$(git rev-parse --short HEAD)-$(git -C ../magic-cards-model rev-parse --short HEAD)"
ENGINE_TAG="$(git -C ../magic-cards-model rev-parse --short HEAD)"
docker buildx build \
  --file Dockerfile \
  --label "pl.szymonrichert.engine-revision=${ENGINE_TAG}" \
  --tag "${HARBOR}/magic-cards-model-api:${TAG}" \
  --load ..
"""

[tasks."docker:build:agent"]
description = "Build the agent image locally, tagged with the sha"
run = """
set -eu
TAG="$(git rev-parse --short HEAD)-$(git -C ../magic-cards-model rev-parse --short HEAD)"
ENGINE_TAG="$(git -C ../magic-cards-model rev-parse --short HEAD)"
docker buildx build \
  --file Dockerfile.agent \
  --build-arg "CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION:-2.1.282}" \
  --build-arg "AGENT_UID=${AGENT_UID:-1000}" \
  --build-arg "AGENT_GID=${AGENT_GID:-1000}" \
  --label "pl.szymonrichert.engine-revision=${ENGINE_TAG}" \
  --tag "${HARBOR}/magic-cards-model-agent:${TAG}" \
  --load ..
"""

# The cluster is x86 and the dev machine is Apple Silicon, so the push tasks
# pin the platform - a plain build here would produce an arm64 image that will
# not run there.
[tasks."docker:push:api"]
description = "Build the api image for the cluster platform and push to harbor"
run = """
set -eu
TAG="$(git rev-parse --short HEAD)-$(git -C ../magic-cards-model rev-parse --short HEAD)"
ENGINE_TAG="$(git -C ../magic-cards-model rev-parse --short HEAD)"
docker buildx build --platform "${DOCKER_PLATFORM:-linux/amd64}" \
  --file Dockerfile \
  --label "pl.szymonrichert.engine-revision=${ENGINE_TAG}" \
  --tag "${HARBOR}/magic-cards-model-api:${TAG}" \
  --push ..
echo "${HARBOR}/magic-cards-model-api:${TAG}"
"""

[tasks."docker:push:agent"]
description = "Build the agent image for the cluster platform and push to harbor"
run = """
set -eu
TAG="$(git rev-parse --short HEAD)-$(git -C ../magic-cards-model rev-parse --short HEAD)"
ENGINE_TAG="$(git -C ../magic-cards-model rev-parse --short HEAD)"
docker buildx build --platform "${DOCKER_PLATFORM:-linux/amd64}" \
  --file Dockerfile.agent \
  --build-arg "CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION:-2.1.282}" \
  --build-arg "AGENT_UID=${AGENT_UID:-1000}" \
  --build-arg "AGENT_GID=${AGENT_GID:-1000}" \
  --label "pl.szymonrichert.engine-revision=${ENGINE_TAG}" \
  --tag "${HARBOR}/magic-cards-model-agent:${TAG}" \
  --push ..
echo "${HARBOR}/magic-cards-model-agent:${TAG}"
"""

[tasks."docker:push"]
description = "Push both images to harbor"
depends = ["docker:push:api", "docker:push:agent"]

# The manifests carry the literal placeholder __TAG__ on every image: line.
[tasks."k8s:render"]
description = "Render deploy/k8s with the sha substituted, to stdout - a single concatenated dump for looking, NOT the apply order k8s:deploy actually uses (that task applies in phases: pre-req objects, then the database, then a migration Job it waits on, then the Deployment/Service/Ingress - see its own comment)"
run = """
set -eu
TAG="$(git rev-parse --short HEAD)-$(git -C ../magic-cards-model rev-parse --short HEAD)"
for f in deploy/k8s/*.yaml; do
  case "$f" in *.template.yaml) continue ;; esac
  echo "---"
  sed "s|__TAG__|${TAG}|g" "$f"
done
# The per-game seat Job and buddy Job are built at runtime from deploy/seat-job.yaml;
# render one of each so the seat-vs-buddy differences (model, role, baton) are visible.
uv run python scripts/render_seat_jobs.py
"""

[tasks."k8s:deploy"]
description = "Push both images at the current sha, then apply in phases: prerequisites, the database, a migration Job (waited on), then the app"
# `depends` on the push because the tag IS the sha: every commit - including a
# commit that only touches a manifest or the README - moves HEAD, and the
# rendered image reference then names a tag nobody has built. The Pod sits in
# ImagePullBackOff and the cause is three commits back. The push is cached, so
# a manifest-only change re-pushes in seconds; correctness is worth those
# seconds. Use `k8s:render` if you only want to look.
#
# THIS IS NOT A SINGLE `kubectl apply -f -` OF THE WHOLE DIRECTORY ANY MORE,
# and a future edit must not collapse it back into one. Alembic takes no lock
# of its own - a concurrent or premature `upgrade head` is a real corruption
# hazard, not a hypothetical one - so the migration Job has to run to
# completion, on the new schema, before the Deployment is allowed to roll
# onto code that expects it. `strategy: Recreate` on the Deployment means the
# old Pod (old schema expectations) is already gone by the time a new one
# starts, so there is no additional rolling-overlap window to guard against -
# only the ordering between "schema migrated" and "new Deployment applied".
#
# Phases:
#   1. Everything except the migration Job, Deployment, Service, Ingress -
#      namespace, the database Cluster, storage, rbac, networkpolicy.
#   2. Wait for the CNPG Cluster to report Ready. A generous timeout (300s)
#      covers first-ever provisioning (pulling the Postgres image, running
#      initdb, binding two Ceph RBD volumes); a re-apply against an
#      already-Ready cluster returns almost immediately regardless. `kubectl
#      wait` exits non-zero on its own timeout, and with `set -eu` and no pipe
#      after it, nothing here swallows that exit code - a timed-out wait
#      aborts the task right there.
#   3. Apply the migration Job. Its name carries __TAG__, so a new tag is
#      always a fresh Job object; re-applying an unchanged tag is a no-op
#      against an already-`Complete` Job (Job specs are otherwise immutable).
#   4. Wait for the Job to reach a terminal state, distinguishing three
#      outcomes explicitly - success, failure, timeout - not two. A plain
#      `kubectl wait --for=condition=complete` sits for the FULL timeout when
#      the Job instead goes `Failed` (which, with `backoffLimit: 0`, can
#      happen within seconds): it does not return early on failure, so a
#      naive script wastes the whole window reporting a generic timeout
#      instead of the real, immediate cause. mise's task shell here is plain
#      `sh` (`mise settings get unix_default_file_shell_args` -> `sh`, no
#      bash 4.3+ `wait -n`), so this polls `kubectl get job ... -o jsonpath`
#      for the Complete/Failed conditions on a short interval against its own
#      deadline instead of backgrounding two `kubectl wait`s - portable, no
#      job-control assumptions. On failure it prints the Job's pod logs to
#      stderr before exiting non-zero, so the actual migration error is
#      visible in this same command's output. On timeout (neither condition
#      true within the deadline) it exits non-zero with wording that says
#      "did not finish within Ns" - deliberately different from the failure
#      message, since they call for different next actions (timeout: check
#      back later; failure: the schema change itself needs fixing).
#   5. Only once step 4 reports success: apply the Deployment, Service,
#      Ingress trio - exactly what the old single-shot apply did for these
#      three, unchanged.
depends = ["docker:push"]
run = """
set -eu
TAG="$(git rev-parse --short HEAD)-$(git -C ../magic-cards-model rev-parse --short HEAD)"
NS=mtg-engine
JOB_NAME="mtg-migrate-${TAG}"

render() {
  sed "s|__TAG__|${TAG}|g" "$1"
}

# --- 1. everything except the migration Job, Deployment, Service, Ingress --
for f in deploy/k8s/*.yaml; do
  case "$f" in
    *.template.yaml) continue ;;
    deploy/k8s/25-migration-job.yaml) continue ;;
    deploy/k8s/50-deployment.yaml) continue ;;
    deploy/k8s/60-service.yaml) continue ;;
    deploy/k8s/70-ingress.yaml) continue ;;
  esac
  echo "---"
  render "$f"
done | kubectl apply -f -

# --- 2. wait for the database to be ready (first-ever provisioning is slow;
# a re-apply against an already-Ready cluster returns almost instantly) -----
kubectl wait --for=condition=Ready "cluster/mtg-database" -n "$NS" --timeout=300s

# --- 3. apply the migration Job -------------------------------------------
render deploy/k8s/25-migration-job.yaml | kubectl apply -f -

# --- 4. poll for Complete/Failed/timeout, distinctly ------------------------
# Deadline is 320s, safely past the Job's own `activeDeadlineSeconds: 300`
# (deploy/k8s/25-migration-job.yaml) - a genuinely hung migration must be
# killed by Kubernetes and land in the "failed" branch below, with its logs
# printed, before this poll loop gives up and reports the generic "timeout"
# branch instead.
deadline=$(($(date +%s) + 320))
outcome="timeout"
while [ "$(date +%s)" -lt "$deadline" ]; do
  conditions="$(kubectl get "job/${JOB_NAME}" -n "$NS" \
    -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}{" "}{.status.conditions[?(@.type=="Failed")].status}' \
    2>/dev/null || true)"
  complete="${conditions%% *}"
  failed="${conditions#* }"
  if [ "$complete" = "True" ]; then
    outcome="success"
    break
  fi
  if [ "$failed" = "True" ]; then
    outcome="failed"
    break
  fi
  sleep 3
done

case "$outcome" in
  success)
    echo "k8s:deploy: migration job/${JOB_NAME} completed"
    ;;
  failed)
    echo "k8s:deploy: migration job/${JOB_NAME} FAILED - logs follow" >&2
    kubectl -n "$NS" logs "job/${JOB_NAME}" >&2 || true
    echo "k8s:deploy: to retry, delete the failed job first: kubectl -n ${NS} delete job/${JOB_NAME}" >&2
    exit 1
    ;;
  timeout)
    echo "k8s:deploy: migration job/${JOB_NAME} did not finish within 320s (neither Complete nor Failed yet) - check back later" >&2
    exit 1
    ;;
esac

# --- 5. only on migration success: the app itself --------------------------
for f in deploy/k8s/50-deployment.yaml deploy/k8s/60-service.yaml deploy/k8s/70-ingress.yaml; do
  echo "---"
  render "$f"
done | kubectl apply -f -
