# TEMPLATE - do not put a real key in a file you might commit.
#
# The preferred route is not to apply this file at all, but to create the
# Secret imperatively so the key never lands on disk in the repo:
#
#     kubectl -n mtg create secret generic mtg-agent \
#       --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
#
# If you do want it declarative, copy this file to `10-secret.yaml` (which is
# gitignored by the pattern in deploy/k8s/.gitignore), replace the placeholder,
# and apply that copy instead.
apiVersion: v1
kind: Secret
metadata:
  name: mtg-agent
  namespace: mtg
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME_sk-ant-..."
