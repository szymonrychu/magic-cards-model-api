# TEMPLATES - do not put a real credential in a file you might commit.
#
# Two Secrets are needed, and neither should be applied from this file with a
# real value in it. The preferred route for both is imperative creation, so the
# credential never lands on disk in the repo:
#
#   1. `mtg-agent` - the Claude credential the agent container runs on.
#
#      RECOMMENDED (an OAuth token from `claude setup-token`):
#
#        kubectl -n mtg-engine create secret generic mtg-agent \
#          --from-literal=CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN"
#
#      OR (a real sk-ant-... API key):
#
#        kubectl -n mtg-engine create secret generic mtg-agent \
#          --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
#
#      Set exactly ONE. A setup-token is NOT an API key: the CLI reads the two
#      from different variables, and a setup-token placed in ANTHROPIC_API_KEY
#      is sent as an API key and gets a 401. Both env vars are declared on the
#      agent container with `optional: true` on the secretKeyRef, so whichever
#      key you did not create is simply absent rather than blocking Pod start.
#
#   2. `mtg-decks-git` - a GitHub PAT the initContainer uses to clone the
#      private deck-guide repo. It needs read access to exactly one repo,
#      github.com/szymonrychu/mtg-decks: a classic PAT with the `repo` scope,
#      or a fine-grained PAT scoped to that single repository with Contents:
#      Read-only. Nothing else.
#
#        kubectl -n mtg-engine create secret generic mtg-decks-git \
#          --from-literal=GH_PAT="$GH_PAT"
#
# If you do want either declarative, copy this file to `10-secret.yaml` (which
# is gitignored by the pattern in deploy/k8s/.gitignore), replace the
# placeholders, and apply that copy instead.
---
apiVersion: v1
kind: Secret
metadata:
  name: mtg-agent
  namespace: mtg-engine
type: Opaque
stringData:
  # Set ONE of these two. Delete the other key rather than leaving it empty:
  # an empty string is still a present value, and the wrapper prefers the token
  # and clears the other so they cannot shadow each other.
  CLAUDE_CODE_OAUTH_TOKEN: "REPLACE_ME_from_claude_setup-token"
  ANTHROPIC_API_KEY: "REPLACE_ME_sk-ant-..."
---
apiVersion: v1
kind: Secret
metadata:
  name: mtg-decks-git
  namespace: mtg-engine
type: Opaque
stringData:
  # A GitHub PAT with read access to szymonrychu/mtg-decks and nothing more.
  # NEVER commit a real token here.
  GH_PAT: "REPLACE_ME_github_pat_..."
