# TEMPLATES - do not put a real credential in a file you might commit.
#
# Four Secrets are needed, and none should be applied from this file with a
# real value in it. The preferred route for all four is imperative creation, so
# the credential never lands on disk in the repo:
#
#   1. `mtg-agent` - the Claude credential the agent container runs on.
#
#      RECOMMENDED (an OAuth token from `claude setup-token`):
#
#        kubectl -n mtg-engine create secret generic mtg-agent \
#          --from-literal=CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN"
#
#      OR (a real sk-ant-... API key):
#
#        kubectl -n mtg-engine create secret generic mtg-agent \
#          --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
#
#      Set exactly ONE. A setup-token is NOT an API key: the CLI reads the two
#      from different variables, and a setup-token placed in ANTHROPIC_API_KEY
#      is sent as an API key and gets a 401. Both env vars are declared on the
#      agent container with `optional: true` on the secretKeyRef, so whichever
#      key you did not create is simply absent rather than blocking Pod start.
#
#   2. `mtg-decks-git` - a GitHub PAT for the private deck-guides repo,
#      github.com/szymonrychu/mtg-decks. Each seat Job's `guides`
#      initContainer makes a WRITABLE clone of it and the agent pushes guide
#      and play-script changes straight to main, so it must be a fine-grained
#      PAT scoped to that single repository with exactly:
#        Contents: Read and write
#        Metadata: Read-only
#        Workflows: No access (never grant it)
#      and nothing else. A classic PAT's `repo` scope covers every repo the
#      account can reach - do not use one.
#
#        kubectl -n mtg-engine create secret generic mtg-decks-git \
#          --from-literal=GH_PAT="$GH_PAT"
#
#      The seat Job mounts the `GH_PAT` key as a FILE at
#      /var/run/mtg-decks-git/GH_PAT (mode 0440, readable via fsGroup 1000)
#      into the `guides` initContainer and the `agent` container only - never
#      as an env var, and never into the driver. git's credential helper
#      reads that file on every push.
#
#      Rotate in place (running pods pick up the new file without a restart):
#
#        kubectl -n mtg-engine create secret generic mtg-decks-git \
#          --from-literal=GH_PAT="$GH_PAT" \
#          --dry-run=client -o yaml | kubectl apply -f -
#
#      Kill switch: set SCRIPTS_ENABLED=false on the API Deployment
#      (`kubectl -n mtg-engine set env deployment/mtg-stack
#      SCRIPTS_ENABLED=false`) to turn agent-authored scripts and guide
#      changes off; revoke the PAT on GitHub for the hard stop.
#
#   3. `mtg-ops` - the operator's cross-game token for `GET
#      /api/ops/dsl-coverage` (`records.authorized_ops_caller`). Every other
#      "admin" credential in this codebase is per-game; this is the one that
#      reads across every game, so it gets its own Secret rather than being
#      folded into an existing one. Generate a random value and keep it
#      somewhere you can hand to whoever runs the coverage query:
#
#        kubectl -n mtg-engine create secret generic mtg-ops \
#          --from-literal=OPS_TOKEN="$OPS_TOKEN"
#
#      `50-deployment.yaml` reads this Secret's `OPS_TOKEN` key with
#      `optional: true`: until this Secret exists, the Pod still starts and
#      the route just stays refused (`authorized_ops_caller` fails closed
#      when `OPS_TOKEN` is unset) rather than accepting anything.
#
#      Rotate the same way as `mtg-decks-git` above (`create --dry-run=client
#      -o yaml | kubectl apply -f -`), then restart the Deployment - env vars
#      from a Secret are read at Pod start, not live-reloaded.
#
#   4. `mtg-sim` - the bearer token of the chat sandbox MCP endpoint
#      (`/sim/mcp`). Its own Secret so it never grants the cross-game reach
#      of `OPS_TOKEN`:
#
#        kubectl -n mtg-engine create secret generic mtg-sim \
#          --from-literal=MTG_SIM_TOKEN="$(openssl rand -hex 32)"
#
#      `50-deployment.yaml` reads it with `optional: true`: without the
#      Secret the endpoint answers 503 (disabled). Env is read at Pod start,
#      so restart the Deployment after rotating.
#
# If you do want any declarative, copy this file to `10-secret.yaml` (which
# is gitignored by the pattern in deploy/k8s/.gitignore), replace the
# placeholders, and apply that copy instead.
---
apiVersion: v1
kind: Secret
metadata:
  name: mtg-agent
  namespace: mtg-engine
type: Opaque
stringData:
  # Set ONE of these two. Delete the other key rather than leaving it empty:
  # an empty string is still a present value, and the wrapper prefers the token
  # and clears the other so they cannot shadow each other.
  CLAUDE_CODE_OAUTH_TOKEN: "REPLACE_ME_from_claude_setup-token"
  ANTHROPIC_API_KEY: "REPLACE_ME_sk-ant-..."
---
apiVersion: v1
kind: Secret
metadata:
  name: mtg-decks-git
  namespace: mtg-engine
type: Opaque
stringData:
  # A fine-grained GitHub PAT for szymonrychu/mtg-decks only: Contents RW,
  # Metadata RO, no Workflows. NEVER commit a real token here.
  GH_PAT: "REPLACE_ME_github_pat_..."
---
apiVersion: v1
kind: Secret
metadata:
  name: mtg-sim
  namespace: mtg-engine
type: Opaque
stringData:
  MTG_SIM_TOKEN: "REPLACE_ME_openssl_rand_hex_32"
