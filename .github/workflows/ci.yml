name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Local suite takes ~196s; this leaves generous headroom for a colder CI
    # runner plus checkout and mise install.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: magic-cards-model-api
    # T9's postgres-backed contract/CAS tests need a real database.
    # MCM_TEST_DATABASE_URL below (set on the "Test postgres" step) points
    # `mise run test:pg` at this service container instead of the docker
    # compose `postgres` it would otherwise bring up itself for local use.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtg
          POSTGRES_PASSWORD: mtg
          POSTGRES_DB: mtg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtg -d mtg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout magic-cards-model-api
        uses: actions/checkout@v7
        with:
          path: magic-cards-model-api

      # The engine is a PATH dependency: pyproject.toml has
      # [tool.uv.sources] magic-cards-model = { path = "../magic-cards-model", editable = true }.
      # `uv sync` needs the engine checked out as a sibling of this repo's
      # own checkout, at ../magic-cards-model relative to the working
      # directory set above. This step goes away once T5 replaces the path
      # dependency with a git-sha dependency.
      # Both repos are private, so the default GITHUB_TOKEN cannot reach the
      # engine. ENGINE_DEPLOY_KEY is the private half of a read-only deploy key
      # registered on szymonrychu/magic-cards-model.
      - name: Checkout magic-cards-model (engine, sibling of this checkout)
        uses: actions/checkout@v7
        with:
          repository: szymonrychu/magic-cards-model
          path: magic-cards-model
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          working_directory: magic-cards-model-api

      # `mise install` installs the tools pinned in mise.toml. It does NOT run
      # the repo's own `install` task, which is what syncs the virtualenv. Both
      # are needed: without the second, `uv run pytest` fails to spawn pytest.
      - name: Install pinned tools
        run: mise install

      - name: Sync the virtualenv
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Test postgres
        env:
          MCM_TEST_DATABASE_URL: postgresql+psycopg://mtg:mtg@localhost:5432/mtg
        run: mise run test:pg
