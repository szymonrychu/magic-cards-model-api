<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>magic-cards-model: play</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ================================ LOBBY ================================ -->
<section id="lobby">
  <header class="lobby-header">
    <h1>magic-cards-model</h1>
    <div id="conn-status" class="pill"></div>
  </header>

  <p class="hint">
    You play one seat by clicking. The other seat is played by a headless
    Claude agent, or - if this server cannot spawn one - by a human you
    dispatch yourself with a copy-pasted prompt.
  </p>

  <div class="deck-pickers">
    <div class="deck-picker" id="picker-you">
      <h3>Your deck</h3>
      <label>Name <input type="text" id="you-name" value="you" /></label>
      <label>Bundled deck
        <select id="you-bundled"><option value="">(none - paste or upload below)</option></select>
      </label>
      <label>Or upload a .txt <input type="file" id="you-upload" accept=".txt" /></label>
      <label>Or paste a decklist
        <textarea id="you-text" rows="9" placeholder="4 Lightning Bolt&#10;20 Mountain&#10;..."></textarea>
      </label>
      <button id="you-validate">Validate</button>
      <div class="validation" id="you-validation"></div>
    </div>

    <div class="deck-picker" id="picker-ai">
      <h3>Opponent's deck</h3>
      <label>Name <input type="text" id="ai-name" value="claude" /></label>
      <label>Bundled deck
        <select id="ai-bundled"><option value="">(none - paste or upload below)</option></select>
      </label>
      <label>Or upload a .txt <input type="file" id="ai-upload" accept=".txt" /></label>
      <label>Or paste a decklist
        <textarea id="ai-text" rows="9" placeholder="4 Lightning Bolt&#10;20 Mountain&#10;..."></textarea>
      </label>
      <button id="ai-validate">Validate</button>
      <div class="validation" id="ai-validation"></div>
      <label>Model
        <input type="text" id="ai-model" list="ai-model-suggestions" placeholder="sonnet" />
        <datalist id="ai-model-suggestions">
          <option value="sonnet"></option>
          <option value="opus"></option>
          <option value="haiku"></option>
          <option value="fable"></option>
        </datalist>
      </label>
      <label>Effort
        <select id="ai-effort">
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high" selected>high</option>
          <option value="xhigh">xhigh</option>
          <option value="max">max</option>
        </select>
      </label>
      <label>Thinking budget (tokens, optional)
        <input type="number" id="ai-thinking" min="0" step="1" placeholder="model default" />
      </label>
    </div>
  </div>

  <div class="lobby-footer">
    <label class="seed">Seed (optional, for a replayable shuffle)
      <input type="number" id="seed" placeholder="random" />
    </label>
    <button id="start-game" class="primary big">Start game</button>
  </div>
  <div id="start-error" class="error"></div>

  <h2>Live games</h2>
  <table id="games-table">
    <thead>
      <tr>
        <th>Opponent</th>
        <th>Turn / step</th>
        <th>Model / effort</th>
        <th>State</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="games-tbody"></tbody>
  </table>
</section>

<!-- ================================= GAME ================================ -->
<section id="game" hidden>

  <!-- top bar: turn, phase track, connection, AI seat, leave -->
  <header id="topbar">
    <div id="turn-info"></div>
    <ol id="phase-track"></ol>
    <div class="topbar-right">
      <div id="ai-panel"></div>
      <div id="conn-status-game" class="pill"></div>
      <button id="open-zones" class="ghost" title="Graveyards, exile, and what you may still cast from it">Zones</button>
      <button id="report-problem" class="ghost">Report</button>
      <button id="leave-game" class="ghost">Lobby</button>
    </div>
  </header>

  <!-- Game over, CR 103.5/103.6's pregame, a live decision, the in-flight
       action's summary, and the combat prompt all render inside
       `#prompt-box` (`ui/render/ribbon.js`'s `renderPromptBox`), in that
       priority order - so there is exactly one place asking the player
       anything, not one banner per case. Only the AI seat's own silence -
       which is not a question the game itself is asking - gets a banner of
       its own: `#ai-loading-banner` while it is still booting (the pod's
       image pull, initContainers, and the agent CLI's own boot - never
       blocking, since CR 103.5/103.6 gate a human's own mulligan and
       opening-hand actions on nothing but themselves), and
       `#ai-stall-banner` once it has started and gone quiet mid-game. -->
  <div id="banners">
    <div id="ai-loading-banner" hidden></div>
    <div id="ai-stall-banner" hidden></div>
  </div>

  <!-- the board: opponent on top, shared stack in the middle, you at the
       bottom, mirrored the way MTGO and Arena lay it out -->
  <div id="mtg-board">
    <div id="opp-info" class="info-row opp"></div>
    <div id="opp-hand" class="hand-row hand-row-opp"></div>
    <div id="opp-battlefield" class="battlefield-row"></div>

    <div id="stack-row" class="stack-row"></div>
    <div id="red-zone" class="red-zone" hidden></div>

    <div id="my-battlefield" class="battlefield-row"></div>
    <div id="casting-strip" class="casting-strip" hidden></div>
    <div id="my-hand" class="hand-row"></div>
    <!-- CR 601.3's dynamic play permissions - cascade, suspend's own third
         ability - cast again from wherever they were exiled to. -->
    <div id="permitted-row" class="hand-row permitted-row" hidden></div>
    <div id="you-info" class="info-row you"></div>
  </div>

  <!-- the one place anything is ever asked of the player -->
  <aside id="side-panel">
    <div id="prompt-box"></div>
    <div id="priority-box"></div>
    <div id="stops-box"></div>
    <div id="log-box"></div>
  </aside>

  <div id="card-preview" class="card-preview" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="popover" class="popover" hidden></div>
  <div id="modal" class="modal" hidden></div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
