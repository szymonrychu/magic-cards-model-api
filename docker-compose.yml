# Bring the whole thing up from the magic-cards-model-api directory:
#
#     cp .env.example .env   # then put ONE of these in it:
#                            #   CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`)
#                            #   ANTHROPIC_API_KEY        (a real sk-ant-... key)
#     docker compose up --build
#
# Then play at http://127.0.0.1:8000/ and pick a deck. The AI seat is
# the continuous agent: it keeps its context across games and writes what it
# learned into ./memory.
#
# Every build context is `..` because the engine is a path dependency at
# ../magic-cards-model.

services:
  game:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "8000:8000"
    environment:
      - AI_SEAT_MODE=wrapper
      - DRIVER_URL=http://driver:8090
      # The browser re-reads the game and the AI seat's status every ~1.2s.
      # Successful reads of those two routes, and of the healthcheck, are kept
      # out of uvicorn's access log; POSTs and any non-2xx always print.
      # ACCESS_LOG_QUIET=0 gives the full access log back on any service.
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
    volumes:
      - ${MTG_DECKS:?set MTG_DECKS in .env}:/guides:ro
      - scryfall-cache:/app/.scryfall-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://127.0.0.1:8000/api/health').raise_for_status()"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile.agent
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    depends_on:
      game:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Either credential. `claude setup-token` produces an OAuth token, which
      # is NOT an API key: the CLI reads them from different variables, and a
      # setup-token placed in ANTHROPIC_API_KEY is sent as an API key and gets
      # a 401. Neither is required here so that setting only one works; the
      # wrapper prefers the token and clears the other so they cannot shadow
      # each other.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - MODEL=${CLAUDE_MODEL:-sonnet}
      - HTTP_ADDR=:8080
      - INTERNAL_ADDR=127.0.0.1:8090
      - WORKSPACE=/workspace
      - HOME_DIR=/agent-home
      - HOOK_COMMAND=/app/.venv/bin/cc-stop-hook
      - CCW_INTERNAL_URL=http://127.0.0.1:8090/internal/turn-complete
      - CCW_RESULT_JSON=/workspace/result.json
      - BASE_MCP_PATH=/app/deploy/mcp.base.json
      - TURN_TIMEOUT_SECONDS=1800
      - BOOT_TIMEOUT_SECONDS=120
      - LOG_LEVEL=info
      # What the agent itself prints while it plays, tailed off the live
      # transcript: off | turns | messages | tools (default). See
      # `wrapper/activity.py`.
      - AGENT_LOG_LEVEL=${AGENT_LOG_LEVEL:-tools}
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
    volumes:
      - ${MTG_DECKS:?set MTG_DECKS in .env}:/guides:ro
      - ./memory:/workspace/memory
    restart: unless-stopped

  driver:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
    command: ["python", "-m", "mtg_agent.driver"]
    depends_on:
      - agent
    ports:
      - "8090:8090"
    environment:
      - GAME_API=http://game:8000
      - WRAPPER_API=http://agent:8080
      - DRIVER_SELF_URL=http://driver:8090
      - GUIDES_ROOT=/guides
      - MEMORY_ROOT=/workspace/memory
      - DRIVER_WORKSPACE=/driver-workspace
      - HTTP_ADDR=:8090
      # The game server polls `GET /status` for as long as a seat is
      # dispatched. Same filter, same escape hatch.
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
    volumes:
      - ${MTG_DECKS:?set MTG_DECKS in .env}:/guides:ro
      - ./memory:/workspace/memory

volumes:
  scryfall-cache:
