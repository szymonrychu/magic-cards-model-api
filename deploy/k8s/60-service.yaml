# One Service, one port: 8000, the API and the play UI.
#
# The old 8080 (agent debug) and 8090 (driver debug) ports are gone from this
# Service along with their containers: each AI seat is now its own Job
# (`k8s_seats.py`), with its own agent/driver containers and its own Pod IP,
# not a sidecar sharing this Deployment's Pod. There is no longer one fixed
# agent/driver pair to expose here - port-forward a seat's own Job Pod
# instead (`kubectl -n mtg-engine get pods -l app.kubernetes.io/name=mtg-agent`)
# if you need to reach one directly.
#
# type is ClusterIP: the ingress (70-ingress.yaml) is the front door, and it
# routes to port 8000 only.
apiVersion: v1
kind: Service
metadata:
  name: mtg-stack
  namespace: mtg-engine
spec:
  type: ClusterIP
  selector:
    app: mtg-stack
  ports:
    - name: game
      port: 8000
      targetPort: 8000
