# One Service, three ports - the same three things compose published.
#
# 8000 is the point of the whole stack: it serves /play/, so without it you
# cannot play. 8090 and 8080 are kept because they are how you see what the
# agent is doing: `GET /status` on the driver says which deck it identified and
# how confidently, and the agent's `/v1/messages/{turnId}` carries the full
# text of a turn the driver only logs a trimmed version of (plus /v1/probe and
# /v1/interrupt when a turn looks stuck). NEITHER HAS ANY AUTHENTICATION.
#
# type is ClusterIP: the ingress (70-ingress.yaml) is the front door now, and
# it routes to port 8000 ONLY. 8080 and 8090 are reachable from inside the
# cluster and by port-forward, and that is the whole point of leaving them on
# the Service - they are debug ports, not published ones:
#
#     kubectl -n mtg-engine port-forward pod/mtg-stack 8000 8080 8090
#
# Do not add 8080 or 8090 to the ingress. Do not switch this back to NodePort
# unless you want those two unauthenticated ports open on every node.
apiVersion: v1
kind: Service
metadata:
  name: mtg-stack
  namespace: mtg-engine
spec:
  type: ClusterIP
  selector:
    app: mtg-stack
  ports:
    - name: game
      port: 8000
      targetPort: 8000
    - name: agent
      port: 8080
      targetPort: 8080
    - name: driver
      port: 8090
      targetPort: 8090
