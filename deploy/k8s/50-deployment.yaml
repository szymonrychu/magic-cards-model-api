# The API, alone, as a single-container Pod run by a single-replica
# Deployment. It used to be one Pod with three containers (game, agent,
# driver) mirroring `docker-compose.yml`'s topology; that is gone. Per-game
# agent pods are now Kubernetes Jobs the API creates itself, one per AI seat
# (`AI_SEAT_MODE=kubernetes`, `src/magic_cards_model_api/k8s_seats.py`), each
# carrying its own agent + driver containers. This Deployment's only job is
# to serve the play UI and API, and to create/watch/delete those Jobs -
# `40-rbac.yaml` is what grants it permission to do that.
#
# WHY A DEPLOYMENT AND NOT A BARE POD: a bare Pod is not rescheduled. Drain the
# node, evict it, lose the kubelet, and it is simply gone - `kubectl get pod`
# returns nothing and somebody has to notice and re-apply it. A Deployment owns
# the Pod through a ReplicaSet, so eviction and node loss are recovered
# automatically, and a changed image tag becomes a rollout instead of a manual
# delete-and-recreate. It is still exactly one Pod: `replicas: 1`.
#
# RECREATE, NOT ROLLING: the Deployment restart wipes every in-memory game
# (games live in memory, see the top-level README), so there is nothing a
# rolling update would preserve.
#
# NO `ownerReferences` ON THE SEAT JOBS (phase 2b T9/T10, deliberately
# changed from the earlier design this comment used to describe): with
# durable games, an API restart must not garbage-collect the seat Jobs of
# games that survived it, so there is no owner-Pod GC to wire up any more -
# `activeDeadlineSeconds`/`ttlSecondsAfterFinished` on each Job
# (`deploy/seat-job.yaml`) are the whole backstop. The downward-API
# `POD_NAME`/`POD_UID`/`POD_NAMESPACE` env this Pod used to carry only for
# that purpose is gone with it.
#
# IMAGES come from Harbor, and `__TAG__` is a LITERAL PLACEHOLDER, not a tag
# that exists. `mise run k8s:deploy` in this repo substitutes it with the
# commit sha and pipes the result to `kubectl apply -f -`. Applying this file
# straight from the repo with plain kubectl will fail to pull; sed it
# yourself first (the README has the one-liner). The same `__TAG__` is used
# for both `AGENT_IMAGE` and `API_IMAGE` below, so one substitution pins both
# the API's own image and the image each Job it creates will pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtg-stack
  namespace: mtg-engine
  labels:
    app: mtg-stack
spec:
  # MUST stay 1 (phase 2b T10 - reason changed, the constraint has not).
  # K8sSeats.reconcile (src/magic_cards_model_api/k8s_seats.py) now compares
  # each Job's game_id label against a live query on the shared repository,
  # not against any one process's own state - two replicas would run that
  # query identically and agree on what to delete, so reconcile is no longer
  # what forbids a second replica. What still does: ai_pregame.py's per-game
  # watcher thread (a 4Hz poll started per game) and ai_seat.registry, the
  # AI seat subprocess/dispatch table - both process-local, in-memory, and
  # not leader-elected. Two replicas would each run their own watcher for
  # every game and could both act on the same pregame obligation at once.
  # Scaling past 1 needs the pregame watcher and seat registry made shared
  # or leader-elected first.
  replicas: 1
  selector:
    matchLabels:
      app: mtg-stack
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mtg-stack
      # Prometheus scrape of the game API's GET /metrics (port 8000). No other
      # workload in this repo declares a scrape convention, so the standard
      # prometheus.io/* pod annotations. /metrics has no auth inside the
      # cluster; the public ingresses never route it (70-ingress.yaml).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      restartPolicy: Always
      serviceAccountName: mtg-api

      # harbor.szymonrichert.pl is a private registry. Every other namespace in
      # this cluster carries a `regcred` docker-registry Secret for it (robot
      # account `robot$kubernetes`); this namespace needs its own copy, because
      # imagePullSecrets are namespaced. See the README for the copy command.
      imagePullSecrets:
        - name: regcred

      # seccompProfile is what the restricted Pod Security Standard actually
      # checks for beyond runAsNonRoot/runAsUser - the README instructs
      # labelling this namespace `pod-security.kubernetes.io/enforce=
      # restricted`, and a Pod missing this would be rejected at admission
      # rather than merely warned about.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: scryfall-cache
          persistentVolumeClaim:
            claimName: mtg-scryfall-cache

      containers:
        # ---------------------------------------------------------------- game --
        - name: game
          image: harbor.szymonrichert.pl/containers/magic-cards-model-api:__TAG__
          # IfNotPresent, not Always: __TAG__ is substituted with an immutable
          # short commit sha, so a tag never means two different images and there
          # is nothing for Always to re-check.
          imagePullPolicy: IfNotPresent
          # allowPrivilegeEscalation/capabilities are the other half of the
          # restricted Pod Security Standard - the same two fields
          # `k8s_seats.CONTAINER_SECURITY` already sets on every per-seat Job
          # container, applied here too so the API Pod itself is admitted
          # under the same policy it asks the namespace to enforce.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # CMD from the Dockerfile: uvicorn magic_cards_model_api.main:app.
          ports:
            - name: game
              containerPort: 8000
          env:
            # kubernetes, not wrapper: each AI seat now runs as its own Job
            # (`k8s_seats.py`) instead of a sidecar agent container sharing
            # this Pod's network namespace, so there is no DRIVER_URL to
            # loopback to any more - see `AgentSettings`/`K8sSettings` for
            # what this mode reads instead.
            - name: AI_SEAT_MODE
              value: kubernetes
            # The one server-side config for what an AI seat plays as
            # (`agent_settings.AgentSettings.default`) - 2026-09-19, owner
            # direction, cost cutting: Sonnet at high effort, for an AI seat
            # and a buddy alike. 2026-09-22, owner: prod playtesting plays on
            # Opus instead; the code default (`DEFAULT_MODEL`) stays Sonnet. No request may choose anything else any
            # more (`decks_api.NewUiPlayer` carries no `agent`/`buddy_agent`
            # field). The post-game review is a separate, fixed choice
            # (`claude-opus-5` at `high`, `AgentSettings.review_default`)
            # that does not read either of these.
            # T6: the seat orchestrator is Sonnet in every mode; the seat's
            # `seat-player` subagents (SEAT_SUBAGENT_MODEL) do the Opus work.
            - name: AGENT_DEFAULT_MODEL
              value: claude-sonnet-5
            # Owner decision (T6): the buddy/advisor stays pinned to Opus
            # (`AgentSettings.advisor_default`), unaffected by the line above.
            - name: ADVISOR_MODEL
              value: claude-opus-5
            # The seat pair, rendered by `k8s_seats.build_job` into every
            # seat Job's agent and driver containers (deploy/seat-job.yaml).
            # Switching channel (off | teams | subagents) is an env change.
            - name: SEAT_AGENT_CHANNEL
              value: teams
            - name: SEAT_SUBAGENT_MODEL
              value: claude-opus-5
            - name: SEAT_SUBAGENT_EFFORT
              value: ""
            # Owner decision 2026-10-03 (S7, seat speed): the seat
            # orchestrator runs at low effort with a 4000 thinking cap; the
            # buddy keeps medium via ADVISOR_EFFORT and never gets the cap.
            - name: AGENT_DEFAULT_EFFORT
              value: low
            - name: AGENT_DEFAULT_MAX_THINKING_TOKENS
              value: "4000"
            - name: ADVISOR_EFFORT
              value: medium
            - name: AGENT_NAMESPACE
              value: mtg-engine
            # This stack's identity (`k8s_seats.LABEL_INSTANCE`): stamped on
            # every seat Job it creates, and the only Jobs its reconcile will
            # ever delete - another process pointed at this namespace can no
            # longer reap this stack's seats, nor this stack another's.
            # Required: kubernetes mode refuses to start without it.
            - name: MTG_STACK_INSTANCE_ID
              value: mtg-engine.mtg-stack
            - name: AGENT_IMAGE
              value: harbor.szymonrichert.pl/containers/magic-cards-model-agent:__TAG__
            - name: API_IMAGE
              value: harbor.szymonrichert.pl/containers/magic-cards-model-api:__TAG__
            - name: API_SERVICE_URL
              value: http://mtg-stack.mtg-engine.svc.cluster.local:8000
            # Which revision of the deck-guides corpus every seat Job checks
            # out (`__GUIDES_REF__` in `deploy/seat-job.yaml`). The checkout
            # is writable - the agent commits on a local `main` tracking
            # `origin/main` - so `deploy/guides-clone.sh` accepts only `main`
            # and refuses anything else, saying so. What it checked out is
            # stamped into the agent's briefing and into the header of the
            # game's plan file, so a game's artifacts always name the corpus
            # they were played against.
            - name: GUIDES_REF
              value: main
            # The kill switch for agent-authored scripts and guide changes
            # made through the writable guides checkout. "true" is the
            # default; set it to "false" (`kubectl -n mtg-engine set env
            # deployment/mtg-stack SCRIPTS_ENABLED=false`) to turn the feature
            # off without a rebuild. Revoking the `mtg-decks-git` PAT is the
            # harder stop - see deploy/k8s/README.md.
            - name: SCRIPTS_ENABLED
              value: "true"
            # The operator's cross-game token for `GET /api/ops/dsl-coverage`
            # (`records.authorized_ops_caller`) - the one credential in this
            # deployment that reads across every game rather than one. Comes
            # from the `mtg-ops` Secret's own `OPS_TOKEN` key (see
            # `deploy/k8s/10-secret.template.yaml` for how to create it);
            # `optional: true` so a namespace that has not created that
            # Secret yet still starts the Pod - the route just stays refused,
            # per `authorized_ops_caller`'s own fail-closed default when
            # `OPS_TOKEN` is unset.
            - name: OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mtg-ops
                  key: OPS_TOKEN
                  optional: true
            - name: SPELLSLINGER_MCP_URL
              value: http://spellslinger-mcp-http.spellslinger-development.svc.cluster.local:8080/mcp
            - name: MAX_LIVE_GAMES
              value: "12"
            # glibc gives every threadpool thread its own malloc arena and
            # keeps each one's freed high-water mark as RSS, so one heavy
            # request left the process near its peak for good - the
            # amplifier behind the 2026-09-27 OOMs. Two arenas cap that.
            - name: MALLOC_ARENA_MAX
              value: "2"
            # The browser re-reads the game, long-polls its log, and re-reads
            # the AI seat's status every ~1.2s. Successful reads of those
            # routes, and of the healthcheck, are kept out of uvicorn's access
            # log; POSTs and any non-2xx always print. Set to "0" to get the
            # full access log back.
            - name: ACCESS_LOG_QUIET
              value: "1"
            # REQUIRE_POSTGRES=1: makes a misconfigured/unreachable database
            # crash loudly at startup instead of silently falling back to
            # InMemoryRepository (see store.py) - the whole point of wiring a
            # real Postgres in is losing that silent fallback, not keeping it
            # as an option.
            - name: REQUIRE_POSTGRES
              value: "1"
            # OIDC: who is asking. This is the other half of
            # 55-oauth2-proxy.yaml's OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER -
            # the proxy puts the realm-signed ID token on the upstream
            # request as `Authorization: Bearer`, and these three are what
            # let `oidc.py` VERIFY it instead of trusting it. Until this
            # block existed `oidc_settings()` returned None, so every game
            # was created with no owner and the lobby could only ever be
            # keyed on the browser's own localStorage - the reported defect.
            #
            # All three values are public identifiers (a realm URL, its JWKS
            # endpoint, a client id), never credentials: the client *secret*
            # lives in the `magic-trainer-webui-proxy` Secret and is read
            # only by the proxy. Nothing here may become a literal secret.
            #
            # The realm, the `magic-trainer-webui` confidential client and
            # its audience mapper are created by terraform in the
            # `infrastructure` repo's keycloak root module. This deployment
            # only points at them; it creates nothing.
            #
            # JWKS is fetched from the realm's live endpoint (cached per URL
            # by `oidc._remote_jwks_client`) rather than pinned as a literal
            # via OIDC_JWKS_STATIC - that variable is `oidc.py`'s offline/
            # test escape hatch, and pinning a key here would break the first
            # time the realm rotates its signing keys.
            - name: OIDC_ISSUER
              value: "https://auth.szymonrichert.pl/realms/spellslinger"
            - name: OIDC_JWKS_URL
              value: "https://auth.szymonrichert.pl/realms/spellslinger/protocol/openid-connect/certs"
            # The client the ID token is issued for. Checking `aud` is what
            # stops a token minted for some *other* client in the same realm
            # from being replayed here as an identity.
            - name: OIDC_AUDIENCE
              value: "magic-trainer-webui"
            # The five components below are shaped identically to
            # `25-migration-job.yaml`'s env block on purpose - same Secret,
            # same keys - so a reviewer can see at a glance both read the
            # exact same database the exact same way. See that file's
            # comment for what CNPG's `mtg-database-app` Secret's keys are
            # and why POSTGRES_* components rather than an assembled
            # DATABASE_URL.
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: mtg-database-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: mtg-database-app
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mtg-database-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mtg-database-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mtg-database-app
                  key: dbname
          volumeMounts:
            - name: scryfall-cache
              mountPath: /app/.scryfall-cache
          # The compose healthcheck, as a k8s probe. /api/health is cheap and is
          # filtered out of uvicorn's access log, so probing it does not spam.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # A uvicorn app serving the lobby's games. Requests are what the
            # scheduler reserves, limits are where it gets throttled/OOMed. 512Mi
            # is the measured steady state of a live game (350-400 MB); the 1Gi
            # limit stays - a long game's review now streams its recorded
            # states instead of decoding them all at once (OM1).
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
