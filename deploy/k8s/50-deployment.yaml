# The API, alone, as a single-container Pod run by a single-replica
# Deployment. It used to be one Pod with three containers (game, agent,
# driver) mirroring `docker-compose.yml`'s topology; that is gone. Per-game
# agent pods are now Kubernetes Jobs the API creates itself, one per AI seat
# (`AI_SEAT_MODE=kubernetes`, `src/magic_cards_model_api/k8s_seats.py`), each
# carrying its own agent + driver containers. This Deployment's only job is
# to serve the play UI and API, and to create/watch/delete those Jobs -
# `40-rbac.yaml` is what grants it permission to do that.
#
# WHY A DEPLOYMENT AND NOT A BARE POD: a bare Pod is not rescheduled. Drain the
# node, evict it, lose the kubelet, and it is simply gone - `kubectl get pod`
# returns nothing and somebody has to notice and re-apply it. A Deployment owns
# the Pod through a ReplicaSet, so eviction and node loss are recovered
# automatically, and a changed image tag becomes a rollout instead of a manual
# delete-and-recreate. It is still exactly one Pod: `replicas: 1`.
#
# RECREATE, NOT ROLLING: the Deployment restart wipes every in-memory game
# (games live in memory, see the top-level README), so there is nothing a
# rolling update would preserve.
#
# NO `ownerReferences` ON THE SEAT JOBS (phase 2b T9/T10, deliberately
# changed from the earlier design this comment used to describe): with
# durable games, an API restart must not garbage-collect the seat Jobs of
# games that survived it, so there is no owner-Pod GC to wire up any more -
# `activeDeadlineSeconds`/`ttlSecondsAfterFinished` on each Job
# (`deploy/seat-job.yaml`) are the whole backstop. The downward-API
# `POD_NAME`/`POD_UID`/`POD_NAMESPACE` env this Pod used to carry only for
# that purpose is gone with it.
#
# IMAGES come from Harbor, and `__TAG__` is a LITERAL PLACEHOLDER, not a tag
# that exists. `mise run k8s:deploy` in this repo substitutes it with the
# commit sha and pipes the result to `kubectl apply -f -`. Applying this file
# straight from the repo with plain kubectl will fail to pull; sed it
# yourself first (the README has the one-liner). The same `__TAG__` is used
# for both `AGENT_IMAGE` and `API_IMAGE` below, so one substitution pins both
# the API's own image and the image each Job it creates will pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtg-stack
  namespace: mtg-engine
  labels:
    app: mtg-stack
spec:
  # MUST stay 1. K8sSeats.reconcile lists every Job labelled
  # app.kubernetes.io/name=mtg-agent in this namespace and deletes any whose
  # game_id is not among this process's own in-memory live games - it is not
  # scoped to "Jobs this Pod owns". A second replica's in-memory game list
  # would not match the first's, so each replica's reconcile loop would treat
  # the other's live games as stray and delete their seat Jobs out from under
  # them within one reconcile interval. Scaling past 1 needs reconcile made
  # owner-scoped (or the live-game set made shared) first.
  replicas: 1
  selector:
    matchLabels:
      app: mtg-stack
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mtg-stack
    spec:
      restartPolicy: Always
      serviceAccountName: mtg-api

      # harbor.szymonrichert.pl is a private registry. Every other namespace in
      # this cluster carries a `regcred` docker-registry Secret for it (robot
      # account `robot$kubernetes`); this namespace needs its own copy, because
      # imagePullSecrets are namespaced. See the README for the copy command.
      imagePullSecrets:
        - name: regcred

      # seccompProfile is what the restricted Pod Security Standard actually
      # checks for beyond runAsNonRoot/runAsUser - the README instructs
      # labelling this namespace `pod-security.kubernetes.io/enforce=
      # restricted`, and a Pod missing this would be rejected at admission
      # rather than merely warned about.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: scryfall-cache
          persistentVolumeClaim:
            claimName: mtg-scryfall-cache

      containers:
        # ---------------------------------------------------------------- game --
        - name: game
          image: harbor.szymonrichert.pl/containers/magic-cards-model-api:__TAG__
          # IfNotPresent, not Always: __TAG__ is substituted with an immutable
          # short commit sha, so a tag never means two different images and there
          # is nothing for Always to re-check.
          imagePullPolicy: IfNotPresent
          # allowPrivilegeEscalation/capabilities are the other half of the
          # restricted Pod Security Standard - the same two fields
          # `k8s_seats.CONTAINER_SECURITY` already sets on every per-seat Job
          # container, applied here too so the API Pod itself is admitted
          # under the same policy it asks the namespace to enforce.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # CMD from the Dockerfile: uvicorn magic_cards_model_api.main:app.
          ports:
            - name: game
              containerPort: 8000
          env:
            # kubernetes, not wrapper: each AI seat now runs as its own Job
            # (`k8s_seats.py`) instead of a sidecar agent container sharing
            # this Pod's network namespace, so there is no DRIVER_URL to
            # loopback to any more - see `AgentSettings`/`K8sSettings` for
            # what this mode reads instead.
            - name: AI_SEAT_MODE
              value: kubernetes
            - name: AGENT_NAMESPACE
              value: mtg-engine
            - name: AGENT_IMAGE
              value: harbor.szymonrichert.pl/containers/magic-cards-model-agent:__TAG__
            - name: API_IMAGE
              value: harbor.szymonrichert.pl/containers/magic-cards-model-api:__TAG__
            - name: API_SERVICE_URL
              value: http://mtg-stack.mtg-engine.svc.cluster.local:8000
            - name: SPELLSLINGER_MCP_URL
              value: http://spellslinger-mcp-http.spellslinger-development.svc.cluster.local:8080/mcp
            - name: MAX_LIVE_GAMES
              value: "4"
