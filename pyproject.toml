[project]
name = "magic-cards-model-api"
version = "0.1.0"
description = "Self-test API over the magic-cards-model rules engine"
requires-python = ">=3.13"
dependencies = [
    "magic-cards-model",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "mcp>=1.2",
    "prometheus-client>=0.21",
    "kubernetes>=36,<37",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "pyyaml>=6",
    "pyjwt[crypto]>=2.13.0",
]

[tool.uv.sources]
magic-cards-model = { path = "../magic-cards-model", editable = true }

[dependency-groups]
# `jsonschema` was already an indirect dependency (via `mcp`); listed
# explicitly because `tests/test_agent_settings_contract.py` imports it
# directly to validate `contract/agent-settings.schema.json`. `pyyaml` is a
# real dependency now (T9's renderer reads the Job template), not a dev one.
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "jsonschema>=4",
    "pytest-xdist>=3.8.0",
    "pytest-randomly>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
cc-stop-hook = "mtg_agent.wrapper.stop_hook:main"
mcp-seat = "magic_cards_model_api.seat_cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/magic_cards_model_api", "src/mtg_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # Opt out of `tests/conftest.py`'s `_harness_credential` fixture, which
    # presents the game's admin key on any mutating game-scoped request that
    # carries none. Only a test whose subject IS the credential rule wants
    # this - see `tests/test_mutation_needs_a_credential.py`.
    "no_harness_credential: send mutating game requests exactly as written, with no credential added",
]
# Repo root on sys.path so tests/wrapper/* can import shared helpers as
# `tests.wrapper.test_session`. A second conftest.py under tests/wrapper/
# cannot do this job: it collides with the top-level `conftest` module that
# ~40 existing tests import by bare name.
pythonpath = ["."]
