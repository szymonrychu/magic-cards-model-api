# The whole stack as ONE Pod with three containers: game, agent, driver.
# It is the docker-compose.yml topology with the network collapsed onto
# loopback. Read that file next to this one; the env below is copied from it.
#
# THREE THINGS CHANGE when the three containers share a Pod:
#
# 1. One network namespace, so every service-name URL becomes 127.0.0.1:
#      http://game:8000   -> http://127.0.0.1:8000    (driver GAME_API, game
#                                                      DRIVER_URL's peer, and
#                                                      the mtg MCP server, see
#                                                      20-configmap-mcp.yaml)
#      http://agent:8080  -> http://127.0.0.1:8080    (driver WRAPPER_API)
#      http://driver:8090 -> http://127.0.0.1:8090    (game DRIVER_URL,
#                                                      driver DRIVER_SELF_URL)
#
# 2. One port space, so the ports must not collide - and in compose THEY DO.
#    The wrapper's loopback-only internal listener is INTERNAL_ADDR, which
#    compose sets to 127.0.0.1:8090 - the same port the driver serves on.
#    Separate namespaces made that harmless; here it would be a bind clash
#    between the agent and the driver. The internal listener is moved to
#    127.0.0.1:8099 below, and CCW_INTERNAL_URL (the URL the stop hook posts
#    the finished turn to) is moved with it. Final port map:
#      8000 game (public)   8080 agent (debug)   8090 driver (debug)
#      8099 agent internal (loopback only, not a containerPort)
#
# 3. `restartPolicy: Always`. The agent EXITS ON PURPOSE at the end of every
#    match - one match per container, then a brand-new claude session - and it
#    exits ZERO (a clean return out of wrapper/__main__). `OnFailure` would
#    therefore never restart it and the stack would sit there dead after game
#    one; `Never` is worse. `Always` restarts the agent container in place
#    while the game and driver containers keep running untouched - a container
#    restart is not a Pod restart, so no state and no listener is lost on the
#    other two, and the driver's next dispatch is answered `pending: true`
#    until the fresh claude has booted. This is the same behaviour compose gets
#    from `restart: unless-stopped`.
#
# IMAGES come from Harbor, and `__TAG__` is a LITERAL PLACEHOLDER, not a tag
# that exists. `mise run k8s:deploy` in this repo substitutes it with
# `git rev-parse --short HEAD` and pipes the result to `kubectl apply -f -`.
# Applying this file straight from the repo with plain kubectl will fail to
# pull; sed it yourself first (the README has the one-liner).
apiVersion: v1
kind: Pod
metadata:
  name: mtg-stack
  namespace: mtg-engine
  labels:
    app: mtg-stack
spec:
  restartPolicy: Always

  # harbor.szymonrichert.pl is a private registry. Every other namespace in
  # this cluster carries a `regcred` docker-registry Secret for it (robot
  # account `robot$kubernetes`); this namespace needs its own copy, because
  # imagePullSecrets are namespaced. See the README for the copy command.
  imagePullSecrets:
    - name: regcred

  # The agent image creates a uid/gid 1000 `agent` user and does `USER agent`
  # because claude REFUSES bypass-permissions mode as root and exits 1 - which
  # surfaces as `claude exited code=1`. Do not "fix" a permission error by
  # putting runAsUser: 0 here; fix the volume ownership instead. fsGroup makes
  # the two PVCs - and the guides emptyDir the initContainer has to write -
  # group-writable by gid 1000.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  volumes:
    # The deck guides. Compose bind-mounts a host directory (`${MTG_DECKS}`);
    # an earlier draft of this file used `hostPath: /srv/mtg-decks`, which
    # PINNED THE POD TO ONE NODE and needed a nodeSelector to be safe. This is
    # an emptyDir filled by the `guides` initContainer below, which is a strict
    # improvement on both counts: the Pod schedules anywhere, and the guides
    # are re-cloned fresh on every Pod start instead of being whatever was last
    # copied onto one node by hand.
    - name: guides
      emptyDir: {}
    - name: memory
      persistentVolumeClaim:
        claimName: mtg-agent-memory
    - name: scryfall-cache
      persistentVolumeClaim:
        claimName: mtg-scryfall-cache
    - name: mcp-base
      configMap:
        name: mtg-agent-mcp
    # The driver's scratch dir (DRIVER_WORKSPACE). In compose this is just
    # container-local disk; an emptyDir is the same thing with a name.
    - name: driver-workspace
      emptyDir: {}

  initContainers:
    # ------------------------------------------------------------- guides --
    # Clone the private deck-guide repo into the `guides` emptyDir before any
    # app container starts. All three containers then mount it read-only at
    # /guides, exactly where compose's bind mount put it.
    #
    # WHY THE AGENT IMAGE: it is the only one of the two that has git.
    # Dockerfile.agent apt-installs `git` (it needs it for the nodesource
    # setup layer and keeps it); the game/driver Dockerfile installs nothing
    # beyond uv. Reusing an image the kubelet is already pulling for the agent
    # container means no second registry, no second pull, and no third thing
    # to keep tagged in step.
    #
    # UID: runs as 1000 under the Pod securityContext, same as everything else.
    # The emptyDir is created for the Pod and chowned to fsGroup 1000 with the
    # setgid bit, so uid 1000 can write into it. Nothing here needs root.
    #
    # TOKEN HYGIENE: the token has to be in the clone URL, and `git clone`
    # PERSISTS whatever URL it was given into .git/config as remote.origin.url.
    # That file would then sit inside /guides for the life of the Pod with the
    # PAT in cleartext, readable by the agent - which is a claude session that
    # can read files. So the remote is immediately reset to the tokenless URL.
    # That is the whole mitigation and it is deliberate: git writes the
    # credential in exactly one place, and this removes it from that place. The
    # clone is --depth 1, so there is no fetch history carrying it either.
    #
    # FAILURE IS LOUD ON PURPOSE: `set -e` plus a non-zero exit leaves the Pod
    # in Init:Error / Init:CrashLoopBackOff, visible in `kubectl get pod`. The
    # alternative - swallowing the error and starting with an empty /guides -
    # would look healthy and play badly, with the driver unable to identify a
    # deck and nobody knowing why. GIT_TERMINAL_PROMPT=0 makes a bad or expired
    # PAT fail immediately instead of blocking on a credential prompt.
    - name: guides
      image: harbor.szymonrichert.pl/containers/magic-cards-model-agent:__TAG__
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -euc
        - |
          test -n "${GH_PAT}" || { echo "GH_PAT is empty - is the mtg-decks-git Secret created?" >&2; exit 1; }
          git clone --depth 1 \
            "https://x-access-token:${GH_PAT}@github.com/szymonrychu/mtg-decks.git" \
            /guides
          # Drop the credential out of .git/config, the only place git kept it.
          git -C /guides remote set-url origin \
            https://github.com/szymonrychu/mtg-decks.git
          ! grep -rq "x-access-token" /guides/.git/config
          echo "guides cloned at $(git -C /guides rev-parse --short HEAD)"
      env:
        - name: GH_PAT
          valueFrom:
            secretKeyRef:
              name: mtg-decks-git
              key: GH_PAT
        - name: GIT_TERMINAL_PROMPT
          value: "0"
        # git wants a HOME it can read; the agent image sets /agent-home and
        # owns it as uid 1000.
        - name: HOME
          value: /agent-home
      volumeMounts:
        - name: guides
          mountPath: /guides
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi

  containers:
    # ---------------------------------------------------------------- game --
    - name: game
      image: harbor.szymonrichert.pl/containers/magic-cards-model-api:__TAG__
      # IfNotPresent, not Always: __TAG__ is substituted with an immutable
      # short commit sha, so a tag never means two different images and there
      # is nothing for Always to re-check.
      imagePullPolicy: IfNotPresent
      # CMD from the Dockerfile: uvicorn magic_cards_model_api.main:app.
      ports:
        - name: game
          containerPort: 8000
      env:
        - name: AI_SEAT_MODE
          value: wrapper
        - name: DRIVER_URL
          value: http://127.0.0.1:8090
        # The browser re-reads the game and the AI seat's status every ~1.2s.
        # Successful reads of those two routes, and of the healthcheck, are
        # kept out of uvicorn's access log; POSTs and any non-2xx always print.
        # Set to "0" to get the full access log back.
        - name: ACCESS_LOG_QUIET
          value: "1"
      volumeMounts:
        - name: guides
          mountPath: /guides
          readOnly: true
        - name: scryfall-cache
          mountPath: /app/.scryfall-cache
      # The compose healthcheck, as a k8s probe. /api/health is cheap and is
      # filtered out of uvicorn's access log, so probing it does not spam.
      readinessProbe:
        httpGet:
          path: /api/health
          port: 8000
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /api/health
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 3
      resources:
        # A uvicorn app serving one game. Conservative on purpose: requests are
        # what the scheduler reserves, limits are where it gets throttled/OOMed.
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

    # --------------------------------------------------------------- agent --
    - name: agent
      image: harbor.szymonrichert.pl/containers/magic-cards-model-agent:__TAG__
      imagePullPolicy: IfNotPresent
      # CMD from Dockerfile.agent: python -m mtg_agent.wrapper, as PID 1 of
      # this container, supervising one interactive claude over a PTY.
      ports:
        - name: agent
          containerPort: 8080
      env:
        # Either credential, from the same Secret, BOTH optional. `claude
        # setup-token` produces an OAuth token, which is NOT an API key: the
        # CLI reads them from different variables, and a setup-token placed in
        # ANTHROPIC_API_KEY is sent as an API key and gets a 401. The token is
        # the recommended one. `optional: true` on both is what makes setting
        # only one work - without it, the missing key would block Pod start.
        - name: CLAUDE_CODE_OAUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: mtg-agent
              key: CLAUDE_CODE_OAUTH_TOKEN
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: mtg-agent
              key: ANTHROPIC_API_KEY
              optional: true
        - name: MODEL
          value: sonnet
        - name: HTTP_ADDR
          value: ":8080"
        # Moved off 8090: that is the driver's port in this Pod. See the
        # header comment.
        - name: INTERNAL_ADDR
          value: 127.0.0.1:8099
        - name: WORKSPACE
          value: /workspace
        - name: HOME_DIR
          value: /agent-home
        - name: HOOK_COMMAND
          value: /app/.venv/bin/cc-stop-hook
        - name: CCW_INTERNAL_URL
          value: http://127.0.0.1:8099/internal/turn-complete
        - name: CCW_RESULT_JSON
          value: /workspace/result.json
        # The k8s copy, with the mtg MCP server pointed at loopback and
        # spellslinger pointed at its in-cluster Service.
        - name: BASE_MCP_PATH
          value: /etc/mtg/mcp.base.json
        - name: TURN_TIMEOUT_SECONDS
          value: "1800"
        - name: BOOT_TIMEOUT_SECONDS
          value: "120"
        - name: LOG_LEVEL
          value: info
        # What the agent itself prints while it plays, tailed off the live
        # transcript: off | turns | messages | tools (default). See
        # `wrapper/activity.py`.
        - name: AGENT_LOG_LEVEL
          value: tools
        - name: ACCESS_LOG_QUIET
          value: "1"
      volumeMounts:
        - name: guides
          mountPath: /guides
          readOnly: true
        - name: memory
          mountPath: /workspace/memory
        - name: mcp-base
          mountPath: /etc/mtg
          readOnly: true
      # BOOT IS SLOW AND MUST NOT BE KILLED. The wrapper boots claude (pty
      # spawn, bypass dialog, output quiescence - up to about two minutes)
      # BEFORE it starts serving HTTP at all, so nothing on :8080 answers
      # during boot. A liveness probe alone would kill the container mid-boot,
      # forever. The startupProbe therefore owns the whole boot window
      # (10s * 36 = 6 minutes of grace) and liveness only starts after it
      # passes, per the kubelet's probe ordering.
      startupProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 36
      # /healthz is "the process is serving"; /readyz is "claude has actually
      # booted and can take a turn" (503 while booting or dead). Readiness
      # gates the Service, liveness must not - a dead claude takes the
      # container down by exiting on its own, which is the designed path.
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      resources:
        # This is the expensive container: a node runtime plus an interactive
        # claude session holding a long transcript. Give it real memory; the
        # CPU limit is generous because a turn is bursty.
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 3Gi

    # -------------------------------------------------------------- driver --
    - name: driver
      image: harbor.szymonrichert.pl/containers/magic-cards-model-api:__TAG__
      imagePullPolicy: IfNotPresent
      command: ["python", "-m", "mtg_agent.driver"]
      ports:
        - name: driver
          containerPort: 8090
      env:
        - name: GAME_API
          value: http://127.0.0.1:8000
        - name: WRAPPER_API
          value: http://127.0.0.1:8080
        - name: DRIVER_SELF_URL
          value: http://127.0.0.1:8090
        - name: GUIDES_ROOT
          value: /guides
        - name: MEMORY_ROOT
          value: /workspace/memory
        - name: DRIVER_WORKSPACE
          value: /driver-workspace
        - name: HTTP_ADDR
          value: ":8090"
        # The game server polls `GET /status` for as long as a seat is
        # dispatched. Same filter, same escape hatch.
        - name: ACCESS_LOG_QUIET
          value: "1"
      volumeMounts:
        - name: guides
          mountPath: /guides
          readOnly: true
        - name: memory
          mountPath: /workspace/memory
        - name: driver-workspace
          mountPath: /driver-workspace
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8090
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8090
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      resources:
        # Bookkeeping and HTTP calls; it does no heavy work of its own.
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
