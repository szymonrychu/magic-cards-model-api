# The agent spawns the `mtg` MCP server itself, over stdio, inside the agent
# container - so that server's `--api` URL is resolved by the agent, not by
# Kubernetes. In compose it points at `http://game:8000`; in one Pod the game
# is on the same network namespace, so it must be `http://127.0.0.1:8000`.
#
# `deploy/mcp.base.json` in the repo is the compose-facing file and is left
# alone. The wrapper reads whatever `BASE_MCP_PATH` points at, so this
# ConfigMap is mounted at /etc/mtg/mcp.base.json and the agent container sets
# BASE_MCP_PATH to that path - no overmount of the repo copy, and compose keeps
# working unchanged.
#
# SPELLSLINGER is also re-pointed, for a different reason. The compose copy
# uses the public ingress `https://mcp.szymonrichert.pl/mcp`, and that ingress
# carries `nginx.ingress.kubernetes.io/whitelist-source-range` limited to the
# LAN ranges (see magic-cards-model/deploy/mcp-ingress.yaml). A Pod's source
# address as seen by that ingress is a cluster pod IP, so going out through the
# public name and back in is both a pointless round trip and a good way to get
# a 403 off the whitelist. The in-cluster Service address skips the ingress
# entirely:
#
#   http://spellslinger-mcp-http.spellslinger-development.svc.cluster.local:8080/mcp
#
# Plain HTTP is fine here: it never leaves the cluster network. If the MCP
# server is ever moved out of `spellslinger-development`, this is the line to
# change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtg-agent-mcp
  namespace: mtg-engine
data:
  mcp.base.json: |
    {
      "mcpServers": {
        "mtg": {
          "command": "python",
          "args": [
            "-m",
            "magic_cards_model_api.mcp",
            "--api",
            "http://127.0.0.1:8000"
          ]
        },
        "spellslinger": {
          "type": "http",
          "url": "http://spellslinger-mcp-http.spellslinger-development.svc.cluster.local:8080/mcp"
        }
      }
    }
