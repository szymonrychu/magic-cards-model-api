# Bring the whole thing up from the magic-cards-model-api directory:
#
#     cp .env.example .env   # then put ONE of these in it:
#                            #   CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`)
#                            #   ANTHROPIC_API_KEY        (a real sk-ant-... key)
#     docker compose up --build
#
# Then play at http://127.0.0.1:8000/ and pick a deck. The AI seat is
# the continuous agent: it keeps its context across games and writes what it
# learned into ./memory.
#
# Every build context is `..` because the engine is a path dependency at
# ../magic-cards-model.
#
# `postgres`/`migrate` ARE wired into `game`: `store.py` reads `POSTGRES_*`/
# `DATABASE_URL` and uses `PostgresRepository` when a database is configured
# (and, with `REQUIRE_POSTGRES` set, refuses to start rather than silently
# fall back to `InMemoryRepository`). `game`'s own `environment:` block below
# does not set `POSTGRES_*` by default, so a plain `docker compose up`
# without them still runs in-memory, as before - `postgres`/`migrate` exist
# here so `PostgresRepository` has something to run against locally, the same
# way `mise run test:pg` brings them up for the postgres-backed test suite.
# `migrate` is a **one-shot**, never started by `docker compose up` on its
# own (see its `profiles`) - alembic migrations run once, by hand or by CI,
# never from an init container or from `game`'s own startup: alembic takes no
# lock, and concurrent `upgrade head` from replicas is a real hazard, not a
# hypothetical one.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mtg}
      # No default on purpose: compose must refuse rather than fall back to a
      # committed literal. mise run compose / test:pg / db:migrate / compose:down
      # all set this from scripts/postgres-password.sh.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:-mtg}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP. Without it pg_isready uses the unix socket,
      # which the image's initdb bootstrap server also answers on - so the
      # check passes while the real postmaster is not yet listening on 5432,
      # and the first TCP client gets "the database system is starting up".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-mtg} -d ${POSTGRES_DB:-mtg}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Components, not an assembled URL: alembic's env.py builds the DSN
      # through db.database_url_from_env, which is the same path the Helm chart
      # uses to pass CloudNativePG's Secret keys. It also keeps a
      # user:password@host shape out of this committed file.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-mtg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:-mtg}
    # Never started by a bare `docker compose up` - run explicitly with
    # `docker compose run --rm migrate` (or `mise run db:migrate`, which does
    # that against a locally-running `postgres` service).
    profiles: ["migrate"]

  game:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "8000:8000"
    environment:
      - AI_SEAT_MODE=wrapper
      - DRIVER_URL=http://driver:8090
      # The browser re-reads the game, long-polls its log, and re-reads the AI
      # seat's status every ~1.2s. Successful reads of those routes, and of
      # the healthcheck, are kept out of uvicorn's access log; POSTs and any
      # non-2xx always print. ACCESS_LOG_QUIET=0 gives the full access log
      # back on any service.
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
    volumes:
      - ${MTG_DECKS:?set MTG_DECKS in .env}:/guides:ro
      - scryfall-cache:/app/.scryfall-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://127.0.0.1:8000/api/health').raise_for_status()"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile.agent
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    depends_on:
      game:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Either credential. `claude setup-token` produces an OAuth token, which
      # is NOT an API key: the CLI reads them from different variables, and a
      # setup-token placed in ANTHROPIC_API_KEY is sent as an API key and gets
      # a 401. Neither is required here so that setting only one works; the
      # wrapper prefers the token and clears the other so they cannot shadow
      # each other.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - MODEL=${CLAUDE_MODEL:-sonnet}
      - EFFORT=${CLAUDE_EFFORT:-high}
      - MAX_THINKING_TOKENS=${CLAUDE_MAX_THINKING_TOKENS:-}
      - HTTP_ADDR=:8080
      - INTERNAL_ADDR=127.0.0.1:8090
      - WORKSPACE=/workspace
      - HOME_DIR=/agent-home
      - HOOK_COMMAND=/app/.venv/bin/cc-stop-hook
      - CCW_INTERNAL_URL=http://127.0.0.1:8090/internal/turn-complete
      - CCW_RESULT_JSON=/workspace/result.json
      - BASE_MCP_PATH=/app/deploy/mcp.base.json
      - TURN_TIMEOUT_SECONDS=1800
      - BOOT_TIMEOUT_SECONDS=120
      - LOG_LEVEL=info
      # What the agent itself prints while it plays, tailed off the live
      # transcript: off | turns | messages | tools (default). See
      # `wrapper/activity.py`.
      - AGENT_LOG_LEVEL=${AGENT_LOG_LEVEL:-tools}
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
    volumes:
      - ${MTG_DECKS:?set MTG_DECKS in .env}:/guides:ro
      - ./memory:/workspace/memory
    restart: unless-stopped

  driver:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: magic-cards-model-api/Dockerfile
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
    command: ["python", "-m", "mtg_agent.driver"]
    depends_on:
      - agent
    ports:
      - "8090:8090"
    environment:
      - GAME_API=http://game:8000
      - WRAPPER_API=http://agent:8080
      - DRIVER_SELF_URL=http://driver:8090
      # Also where the driver reads the guides corpus revision from. There
      # is no `.guides-revision` stamp here - that is written by the
      # kubernetes `guides` initContainer (`deploy/seat-job.yaml`) - so the
      # driver falls back to the bind-mounted checkout's own `.git`, which
      # is why $MTG_DECKS has to be a real clone rather than a copy of the
      # files. See `mtg_agent/driver/revision.py`.
      - GUIDES_ROOT=/guides
      - MEMORY_ROOT=/workspace/memory
      - DRIVER_WORKSPACE=/driver-workspace
      - HTTP_ADDR=:8090
      # The game server polls `GET /status` for as long as a seat is
      # dispatched. Same filter, same escape hatch.
      - ACCESS_LOG_QUIET=${ACCESS_LOG_QUIET:-1}
    volumes:
      - ${MTG_DECKS:?set MTG_DECKS in .env}:/guides:ro
      - ./memory:/workspace/memory

volumes:
  scryfall-cache:
  postgres-data:
